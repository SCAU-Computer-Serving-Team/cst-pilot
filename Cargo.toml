[workspace]
resolver = "2"
members = [
    "crates/pi-ai",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
async-stream = "0.3"
base64 = "0.22"
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = 0

[profile.release]
opt-level = 2
strip = "symbols"
