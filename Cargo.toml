[workspace]
resolver = "2"
exclude = ["vendor/regress", "vendor/rquickjs-sys"]
members = [
    "crates/pi-ai",
    "crates/pi-agent",
    "crates/pi-session",
    "crates/pi-runtime",
    "crates/cst-pilot",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
async-stream = "0.3"
base64 = "0.22"
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
rquickjs = { version = "0.14" }
unicode-segmentation = "1.13"
regex = "=1.13.1"
regress = { path = "vendor/regress", version = "=0.12.0", default-features = false, features = ["std", "utf16"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
schemars = { version = "=1.2.3", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util", "io-std", "process"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4", "v7"] }

[patch.crates-io]
rquickjs-sys = { path = "vendor/rquickjs-sys" }

[profile.dev]
debug = 0

[profile.release]
opt-level = 2
strip = "symbols"
