[package]
name = "regress"
version = "0.12.0"
authors = ["ridiculousfish <corydoras@ridiculousfish.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
description = "ECMAScript regex engine with a native execution budget"
repository = "https://github.com/ridiculousfish/regress"
publish = false

[features]
default = ["std", "backend-pikevm"]
std = ["memchr/std"]
alloc = ["dep:hashbrown", "memchr/alloc"]
backend-pikevm = []
index-positions = []
pattern = []
prohibit-unsafe = []
utf16 = []

[dependencies]
memchr = { version = "2.4.0", default-features = false }
hashbrown = { version = ">=0.16, <0.18", optional = true }
