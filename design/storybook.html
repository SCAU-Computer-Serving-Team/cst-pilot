/* ============================================================================
   动效曲线交互渲染引擎 (极简视觉舞台 + 左下控制槽 + Bezier 数学求解)
   ============================================================================ */
function sampleCubicBezier(x1, y1, x2, y2, t) {
  if (t <= 0) return 0;
  if (t >= 1) return 1;
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = u => ((ax * u + bx) * u + cx) * u;
  const sy = u => ((ay * u + by) * u + cy) * u;
  const dx = u => (3 * ax * u + 2 * bx) * u + cx;
  let u = t;
  for (let i = 0; i < 6; i++) {
    const err = sx(u) - t;
    if (Math.abs(err) < 1e-5) break;
    const d = dx(u);
    if (Math.abs(d) < 1e-5) break;
    u -= err / d;
  }
  u = Math.max(0, Math.min(1, u));
  if (Math.abs(sx(u) - t) > 1e-4) {
    let lo = 0, hi = 1;
    for (let i = 0; i < 14; i++) {
      const err = sx(u) - t;
      if (Math.abs(err) < 1e-5) break;
      if (err < 0) lo = u; else hi = u;
      u = (lo + hi) * 0.5;
    }
  }
  return sy(u);
}

function mountMotionCurveStage(stageEl, controlsEl, cfg) {
  const isSpring = cfg.mode === "bezier" && cfg.bezier && cfg.bezier[1] > 1;
  const yMax = isSpring ? 1.16 : 1.0;
  const X0 = 32, X1 = 440, Y0 = 286, Y1 = 20;
  const W = X1 - X0, H = Y0 - Y1;
  const mapX = t => X0 + t * W;
  const mapY = p => Y0 - (p / yMax) * H;

  const evalMain = (t) => {
    if (cfg.mode === "step") return t <= 0 ? 0 : 1;
    if (cfg.mode === "bezier" || cfg.mode === "asymmetric") {
      const [x1, y1, x2, y2] = cfg.bezier || [0.22, 1, 0.36, 1];
      return sampleCubicBezier(x1, y1, x2, y2, t);
    }
    return t;
  };
  const evalRef = (t) => {
    if (cfg.refBezier) {
      const [x1, y1, x2, y2] = cfg.refBezier;
      return sampleCubicBezier(x1, y1, x2, y2, t);
    }
    return t;
  };

  let svgInner = "";
  const gridSteps = isSpring ? [0, 0.5, 1.0, 1.15] : [0, 0.5, 1.0];
  gridSteps.forEach(g => {
    const gy = mapY(g).toFixed(1);
    const isUnit = g === 1.0 && isSpring;
    svgInner += `<line x1="${X0}" y1="${gy}" x2="${X1}" y2="${gy}" stroke="${isUnit ? "var(--border-strong)" : "var(--border-subtle)"}" stroke-width="1" ${isUnit ? 'stroke-dasharray="4 3"' : ""}/>`;
    if (cfg.mode !== "stagger" && (g === 0 || g === 1.0)) {
      svgInner += `<text x="${X0 - 10}" y="${Number(gy) + 4}" text-anchor="end" font-size="12" font-family="var(--font-mono)" fill="var(--text-muted)">${g}</text>`;
    }
  });
  [0, 0.5, 1.0].forEach(g => {
    const gx = mapX(g).toFixed(1);
    svgInner += `<line x1="${gx}" y1="${Y1}" x2="${gx}" y2="${Y0}" stroke="var(--border-subtle)" stroke-width="1"/>`;
    if (g === 0 || g === 1.0) {
      svgInner += `<text x="${gx}" y="${Y0 + 20}" text-anchor="middle" font-size="12" font-family="var(--font-mono)" fill="var(--text-muted)">${cfg.mode === "stagger" ? `${Math.round(g * 300)}ms` : g}</text>`;
    }
  });

  if (cfg.mode === "bezier") {
    const [x1, y1, x2, y2] = cfg.bezier;
    if (isSpring) {
      svgInner += `<rect x="${X0}" y="${Y1}" width="${W}" height="${(mapY(1.0) - Y1).toFixed(1)}" fill="var(--bg-surface)" opacity="0.8"/>`;
    }
    const refPts = [];
    for (let i = 0; i <= 40; i++) {
      const t = i / 40;
      refPts.push(`${mapX(t).toFixed(1)},${mapY(evalRef(t)).toFixed(1)}`);
    }
    svgInner += `<polyline points="${refPts.join(" ")}" fill="none" stroke="var(--text-muted)" stroke-width="1.4" stroke-dasharray="5 5" opacity="0.55"/>`;
    const p1x = mapX(x1).toFixed(1), p1y = mapY(y1).toFixed(1);
    const p2x = mapX(x2).toFixed(1), p2y = mapY(y2).toFixed(1);
    svgInner += `<line x1="${X0}" y1="${Y0}" x2="${p1x}" y2="${p1y}" stroke="var(--text-muted)" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.65"/>`;
    svgInner += `<line x1="${X1}" y1="${mapY(1).toFixed(1)}" x2="${p2x}" y2="${p2y}" stroke="var(--text-muted)" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.65"/>`;
    const pts = [];
    for (let i = 0; i <= 72; i++) {
      const t = i / 72;
      pts.push(`${mapX(t).toFixed(1)},${mapY(evalMain(t)).toFixed(1)}`);
    }
    svgInner += `<polyline points="${pts.join(" ")}" fill="none" stroke="var(--text-primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
    svgInner += `<circle cx="${p1x}" cy="${p1y}" r="5" fill="var(--bg-workspace)" stroke="var(--text-secondary)" stroke-width="1.8"/>`;
    svgInner += `<circle cx="${p2x}" cy="${p2y}" r="5" fill="var(--bg-workspace)" stroke="var(--text-secondary)" stroke-width="1.8"/>`;
    svgInner += `<line id="m-proj-x" x1="${X0}" y1="${Y0}" x2="${X0}" y2="${Y0}" stroke="var(--text-muted)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.55"/>`;
    svgInner += `<line id="m-proj-y" x1="${X0}" y1="${Y0}" x2="${X0}" y2="${Y0}" stroke="var(--text-muted)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.55"/>`;
    svgInner += `<circle id="m-dot" cx="${X0}" cy="${Y0}" r="6.5" fill="var(--text-primary)" stroke="var(--bg-workspace)" stroke-width="2.4"/>`;
  } else if (cfg.mode === "step") {
    const refPts = [];
    for (let i = 0; i <= 40; i++) {
      const t = i / 40;
      refPts.push(`${mapX(t).toFixed(1)},${mapY(evalRef(t)).toFixed(1)}`);
    }
    svgInner += `<polyline points="${refPts.join(" ")}" fill="none" stroke="var(--text-muted)" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.6"/>`;
    svgInner += `<polyline points="${X0},${Y0} ${X0},${mapY(1)} ${X1},${mapY(1)}" fill="none" stroke="var(--text-primary)" stroke-width="3" stroke-linejoin="miter"/>`;
    svgInner += `<line id="m-proj-x" x1="${X0}" y1="${Y0}" x2="${X0}" y2="${Y0}" stroke="var(--text-muted)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.55"/>`;
    svgInner += `<line id="m-proj-y" x1="${X0}" y1="${Y0}" x2="${X0}" y2="${Y0}" stroke="var(--text-muted)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.55"/>`;
    svgInner += `<circle id="m-dot" cx="${X0}" cy="${Y0}" r="6.5" fill="var(--text-primary)" stroke="var(--bg-workspace)" stroke-width="2.4"/>`;
  } else if (cfg.mode === "asymmetric") {
    const openPts = [], closePts = [], revPts = [];
    const closeRatio = (cfg.closeMs || 150) / (cfg.durationMs || 240);
    for (let i = 0; i <= 64; i++) {
      const t = i / 64;
      openPts.push(`${mapX(t).toFixed(1)},${mapY(evalMain(t)).toFixed(1)}`);
      const tc = Math.min(1, t / closeRatio);
      closePts.push(`${mapX(t).toFixed(1)},${mapY(1 - evalMain(tc)).toFixed(1)}`);
    }
    const cutT = 0.36;
    const cutP = evalMain(cutT);
    for (let i = 0; i <= 36; i++) {
      const u = i / 36;
      const t = cutT + u * (closeRatio * 0.62);
      if (t <= 1) revPts.push(`${mapX(t).toFixed(1)},${mapY(cutP * (1 - evalMain(u))).toFixed(1)}`);
    }
    svgInner += `<polyline points="${openPts.join(" ")}" fill="none" stroke="var(--text-primary)" stroke-width="3" stroke-linecap="round"/>`;
    svgInner += `<polyline points="${closePts.join(" ")}" fill="none" stroke="var(--text-secondary)" stroke-width="2.4" stroke-linecap="round"/>`;
    svgInner += `<polyline points="${revPts.join(" ")}" fill="none" stroke="var(--status-warning)" stroke-width="2.2" stroke-dasharray="5 4"/>`;
    svgInner += `<circle cx="${mapX(cutT).toFixed(1)}" cy="${mapY(cutP).toFixed(1)}" r="4.8" fill="var(--status-warning)"/>`;
    svgInner += `<line id="m-proj-x" x1="${X0}" y1="${Y0}" x2="${X0}" y2="${Y0}" stroke="var(--text-muted)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.55"/>`;
    svgInner += `<line id="m-proj-y" x1="${X0}" y1="${Y0}" x2="${X0}" y2="${Y0}" stroke="var(--text-muted)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.55"/>`;
    svgInner += `<circle id="m-dot" cx="${X0}" cy="${Y0}" r="6.5" fill="var(--text-primary)" stroke="var(--bg-workspace)" stroke-width="2.4"/>`;
  } else if (cfg.mode === "stagger") {
    const bars = [
      { start: 0, end: 220, op: 0.90 },
      { start: 40, end: 260, op: 0.68 },
      { start: 80, end: 300, op: 0.48 },
      { start: 120, end: 300, op: 0.32 }
    ];
    bars.forEach((b, i) => {
      const y = Y1 + 24 + i * 60;
      const bx = mapX(b.start / 300);
      const bw = mapX(b.end / 300) - bx;
      svgInner += `<rect x="${bx.toFixed(1)}" y="${y}" width="${bw.toFixed(1)}" height="28" rx="6" fill="var(--text-primary)" opacity="${b.op}"/>`;
      svgInner += `<text x="${(bx + 10).toFixed(1)}" y="${y + 18}" font-size="12" font-family="var(--font-mono)" fill="var(--bg-workspace)">+${b.start}ms</text>`;
    });
    svgInner += `<line x1="${X1}" y1="${Y1}" x2="${X1}" y2="${Y0}" stroke="var(--status-danger)" stroke-width="1.6" stroke-dasharray="5 4"/>`;
    svgInner += `<line id="m-playhead" x1="${X0}" y1="${Y1}" x2="${X0}" y2="${Y0}" stroke="var(--text-primary)" stroke-width="1.8"/>`;
  }

  let visHtml = "";
  if (cfg.mode === "stagger") {
    visHtml = `
      <div class="sb-m-vis-stack" style="gap:10px;">
        ${[0, 40, 80, 120].map((d, i) => `
          <div class="sb-m-track-group" style="gap:4px;">
            <div class="sb-m-track-label">
              <span class="mono">+${d}ms</span>
              <span class="mono" data-stagger-pct="${i}">0%</span>
            </div>
            <div class="sb-m-track" style="height:24px;">
              <div class="sb-m-track-rail"></div>
              <div class="sb-m-track-puck" style="top:2px;width:20px;height:20px;border-radius:4px;" data-stagger-puck="${i}"></div>
            </div>
          </div>
        `).join("")}
      </div>
    `;
  } else if (cfg.mode === "asymmetric") {
    visHtml = `
      <div class="sb-m-vis-stack">
        <div class="sb-m-track-group">
          <div class="sb-m-track-label"><span>开 240ms</span><span class="mono" id="m-asym-open-pct">0%</span></div>
          <div class="sb-m-track"><div class="sb-m-track-rail"></div><div class="sb-m-track-puck" id="m-puck-main"></div></div>
        </div>
        <div class="sb-m-track-group">
          <div class="sb-m-track-label"><span>关 150ms</span><span class="mono" id="m-asym-close-pct">100%</span></div>
          <div class="sb-m-track"><div class="sb-m-track-rail"></div><div class="sb-m-track-puck is-ref" id="m-puck-ref"></div></div>
        </div>
      </div>
    `;
  } else {
    visHtml = `
      <div class="sb-m-vis-stack">
        <div class="sb-m-track-group">
          <div class="sb-m-track-label"><span>${escapeHtml(cfg.curveLabel || "")}</span><span class="mono" id="m-main-val">0.00</span></div>
          <div class="sb-m-track"><div class="sb-m-track-rail"></div><div class="sb-m-track-puck" id="m-puck-main"></div></div>
        </div>
        <div class="sb-m-track-group">
          <div class="sb-m-track-label"><span>${escapeHtml(cfg.refLabel || "Linear")}</span><span class="mono" id="m-ref-val">0.00</span></div>
          <div class="sb-m-track"><div class="sb-m-track-rail"></div><div class="sb-m-track-puck is-ref" id="m-puck-ref"></div></div>
        </div>
      </div>
    `;
  }

  const tabs = cfg.tabs || [];
  const compactScaleIds = new Set(["flip", "collapse", "drawer", "stagger", "stream", "list"]);
  const tabsHtml = tabs.length ? `
    <div class="sb-m-live-wrap">
      <div class="sb-m-live-tabs" role="tablist">
        ${tabs.map((tb, i) => `<button type="button" class="sb-m-live-tab" data-m-tab="${tb.id}" data-active="${i === 0}" role="tab" aria-selected="${i === 0}">${escapeHtml(tb.label)}</button>`).join("")}
      </div>
      <div class="sb-m-live-stage">
        ${tabs.map((tb, i) => {
          const sc = tb.scale || (compactScaleIds.has(tb.id) ? 1.2 : 1.45);
          return `<div class="sb-m-live-pane" data-m-pane="${tb.id}" ${i === 0 ? "" : "hidden"}><div class="sb-m-live-scale" data-live-scale="${sc}" style="--m-live-scale:${sc};">${tb.html}</div></div>`;
        }).join("")}
      </div>
    </div>
  ` : "";

  stageEl.innerHTML = `
    <div class="sb-motion-stage">
      <div class="sb-m-hero">
        <div class="sb-m-col-curve">
          <svg class="sb-m-svg" viewBox="0 0 460 318" aria-label="动效曲线">${svgInner}</svg>
          <div class="sb-m-scrubber-row">
            <input type="range" class="sb-m-range" id="m-scrubber" min="0" max="1000" value="0" aria-label="时间进度" />
            <div class="sb-m-readout">
              <span><b id="m-ms-val">0</b>/${cfg.durationMs}ms</span>
              <span>t <b id="m-t-val">0.00</b></span>
              <span>p <b id="m-p-val">0.00</b></span>
            </div>
          </div>
        </div>
        <div class="sb-m-col-demo">
          ${visHtml}
          ${tabsHtml}
        </div>
      </div>
    </div>
  `;

  // 左下控制槽（与其他组件一致）
  const playBtnCls = cfg.playIsPrimary === false ? "tier-1-btn-outline" : "tier-1-btn-primary";
  if (controlsEl) {
    controlsEl.innerHTML = `
      <button type="button" class="${playBtnCls}" id="m-play-btn" style="height:28px;font-size:12px;gap:6px;">
        ${icon("play", 13)}<span class="cjk">播放</span>
      </button>
      <button type="button" class="tier-1-btn-outline" id="m-slow-btn" data-active="${AppState.slowMotion}" style="height:28px;font-size:12px;gap:6px;">
        ${icon("gauge", 13)}<span>0.25×</span>
      </button>
      <button type="button" class="sb-m-formula" id="m-copy-formula" title="复制参数">${icon("copy", 12)}<span>${escapeHtml(cfg.formula)}</span></button>
    `;
  }

  const scrubber = stageEl.querySelector("#m-scrubber");
  const msValEl = stageEl.querySelector("#m-ms-val");
  const tValEl = stageEl.querySelector("#m-t-val");
  const pValEl = stageEl.querySelector("#m-p-val");
  const playBtn = controlsEl?.querySelector("#m-play-btn");
  const slowBtn = controlsEl?.querySelector("#m-slow-btn");
  const copyFormulaBtn = controlsEl?.querySelector("#m-copy-formula");

  const dotEl = stageEl.querySelector("#m-dot");
  const projX = stageEl.querySelector("#m-proj-x");
  const projY = stageEl.querySelector("#m-proj-y");
  const playheadEl = stageEl.querySelector("#m-playhead");
  const puckMain = stageEl.querySelector("#m-puck-main");
  const puckRef = stageEl.querySelector("#m-puck-ref");
  const mainValEl = stageEl.querySelector("#m-main-val");
  const refValEl = stageEl.querySelector("#m-ref-val");

  stageEl.querySelectorAll("[data-m-tab]").forEach(btn => {
    btn.addEventListener("click", () => {
      const targetId = btn.dataset.mTab;
      stageEl.querySelectorAll("[data-m-tab]").forEach(b => {
        const on = b === btn;
        b.dataset.active = String(on);
        b.setAttribute("aria-selected", String(on));
      });
      stageEl.querySelectorAll("[data-m-pane]").forEach(p => {
        p.hidden = p.dataset.mPane !== targetId;
      });
      if (cfg.onTabChange) cfg.onTabChange(targetId);
    });
  });

  const syncSlowLabel = () => {
    if (!slowBtn) return;
    slowBtn.dataset.active = String(AppState.slowMotion);
    slowBtn.style.background = AppState.slowMotion ? "var(--bg-item-active)" : "";
  };
  syncSlowLabel();

  const renderAt = (t) => {
    const tc = Math.max(0, Math.min(1, t));
    const p = evalMain(tc);
    if (msValEl) msValEl.textContent = String(Math.round(tc * cfg.durationMs));
    tValEl.textContent = tc.toFixed(2);
    pValEl.textContent = p.toFixed(2);
    scrubber.value = String(Math.round(tc * 1000));

    if (cfg.mode === "stagger") {
      if (playheadEl) {
        const px = mapX(tc).toFixed(1);
        playheadEl.setAttribute("x1", px);
        playheadEl.setAttribute("x2", px);
      }
      const nowMs = tc * 300;
      const specs = [[0, 220], [40, 260], [80, 300], [120, 300]];
      specs.forEach(([s, e], idx) => {
        const localT = Math.max(0, Math.min(1, (nowMs - s) / (e - s)));
        const lp = sampleCubicBezier(0.22, 1, 0.36, 1, localT);
        const puck = stageEl.querySelector(`[data-stagger-puck="${idx}"]`);
        const pct = stageEl.querySelector(`[data-stagger-pct="${idx}"]`);
        if (puck && puck.parentElement) {
          const travel = Math.max(20, puck.parentElement.clientWidth - 20);
          puck.style.transform = `translateX(${(lp * travel).toFixed(1)}px)`;
        }
        if (pct) pct.textContent = `${Math.round(lp * 100)}%`;
      });
      return;
    }

    if (dotEl) {
      const cx = mapX(tc).toFixed(1);
      const cy = mapY(p).toFixed(1);
      dotEl.setAttribute("cx", cx);
      dotEl.setAttribute("cy", cy);
      if (projX) { projX.setAttribute("x1", cx); projX.setAttribute("y1", cy); projX.setAttribute("x2", cx); projX.setAttribute("y2", String(Y0)); }
      if (projY) { projY.setAttribute("x1", String(X0)); projY.setAttribute("y1", cy); projY.setAttribute("x2", cx); projY.setAttribute("y2", cy); }
    }

    if (cfg.mode === "asymmetric") {
      const closeRatio = (cfg.closeMs || 150) / (cfg.durationMs || 240);
      const closeP = 1 - evalMain(Math.min(1, tc / closeRatio));
      if (puckMain && puckMain.parentElement) {
        const travel = Math.max(20, puckMain.parentElement.clientWidth - 28);
        puckMain.style.transform = `translateX(${(p * travel).toFixed(1)}px)`;
      }
      if (puckRef && puckRef.parentElement) {
        const travel = Math.max(20, puckRef.parentElement.clientWidth - 28);
        puckRef.style.transform = `translateX(${(closeP * travel).toFixed(1)}px)`;
      }
      const oEl = stageEl.querySelector("#m-asym-open-pct");
      const cEl = stageEl.querySelector("#m-asym-close-pct");
      if (oEl) oEl.textContent = `${Math.round(p * 100)}%`;
      if (cEl) cEl.textContent = `${Math.round(closeP * 100)}%`;
      return;
    }

    const r = evalRef(tc);
    const padRight = isSpring ? 44 : 28;
    if (puckMain && puckMain.parentElement) {
      const travel = Math.max(20, puckMain.parentElement.clientWidth - padRight);
      puckMain.style.transform = `translateX(${(p * travel).toFixed(1)}px)`;
    }
    if (puckRef && puckRef.parentElement) {
      const travel = Math.max(20, puckRef.parentElement.clientWidth - padRight);
      puckRef.style.transform = `translateX(${(r * travel).toFixed(1)}px)`;
    }
    if (mainValEl) mainValEl.textContent = p.toFixed(2);
    if (refValEl) refValEl.textContent = r.toFixed(2);
  };

  let rafId = 0;
  let playing = false;
  const stopPlay = () => {
    playing = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
  };

  const playDemo = () => {
    stopPlay();
    syncSlowLabel();
    const totalMs = AppState.reducedMotion ? 0 : ms(cfg.durationMs);
    if (totalMs <= 0) { renderAt(1); return; }
    playing = true;
    renderAt(0);
    let t0 = null;
    const tick = (now) => {
      if (!playing) return;
      if (t0 === null) t0 = now;
      const frac = Math.min(1, (now - t0) / totalMs);
      renderAt(frac);
      if (frac < 1) rafId = requestAnimationFrame(tick);
      else { playing = false; rafId = 0; }
    };
    rafId = requestAnimationFrame(tick);
  };

  playBtn?.addEventListener("click", playDemo);
  scrubber.addEventListener("input", () => { stopPlay(); renderAt(Number(scrubber.value) / 1000); });
  slowBtn?.addEventListener("click", () => {
    const globalSlow = document.getElementById("sb-set-slow-btn");
    if (globalSlow) globalSlow.click();
    syncSlowLabel();
  });
  copyFormulaBtn?.addEventListener("click", () => {
    if (navigator.clipboard) navigator.clipboard.writeText(cfg.formula).catch(() => {});
    showToast({ text: `已复制：${cfg.formula}` });
  });

  requestAnimationFrame(() => playDemo());
  AppState.cleanups.push(stopPlay);
  return { playDemo, renderAt, stopPlay };
}

/* (@section:runtime:start) 单一数据源派生目录、分类与组件规格 */
const CATEGORIES = AGENT_SPEC.categories;
const STORY_TAXONOMY = AGENT_SPEC.taxonomy;

STORIES.forEach(s => {
  const tax = STORY_TAXONOMY[s.id];
  if (!tax) return;
  s.category = tax.category;
  s.sortOrder = tax.order;
  if (tax.zh) s.zh = tax.zh;
  if (tax.en) s.en = tax.en;
  if (tax.keywords) s.keywords = tax.keywords;
});

function renderSpecText(rawText) {
  const escaped = escapeHtml(rawText || "");
  return escaped.replace(/(\$[a-z0-9-]+|frosted-glass)/g, (tok) => {
    const info = TOKEN_LOOKUP.get(tok);
    if (!info) return tok;
    const swatch = info.type === "bg" || info.type === "border"
      ? `<span class="tok-swatch" style="background:var(${info.cssVar});"></span>`
      : info.type === "shadow"
        ? `<span class="tok-swatch" style="background:var(--bg-workspace);box-shadow:var(${info.cssVar});"></span>`
      : info.type === "glass"
        ? `<span class="tok-swatch" style="background:linear-gradient(135deg,var(--accent-tint),var(--bg-surface));"></span>`
        : "";
    return `<button type="button" class="tok-chip" data-jump-token="${escapeHtml(tok)}" title="${escapeHtml(info.zh)}：${escapeHtml(info.desc)}（点击查看完整令牌说明）">${swatch}<span>${escapeHtml(tok)}</span></button>`;
  });
}

function zoomToSliderVal(z) {
  const ratio = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z)) / ZOOM_MIN;
  return Math.round((Math.log(ratio) / Math.log(ZOOM_MAX / ZOOM_MIN)) * 100);
}
function sliderValToZoom(v) {
  const t = Math.max(0, Math.min(1, Number(v) / 100));
  const raw = ZOOM_MIN * Math.pow(ZOOM_MAX / ZOOM_MIN, t);
  if (raw >= 4) return Math.round(raw * 2) / 2;
  if (raw >= 2) return Math.round(raw * 4) / 4;
  return Math.round(raw * 20) / 20;
}

function getStoryRefLabel(story) {
  const specs = [...new Set((story.penIds || []).map(pid => PEN_MASTER_SPECS[pid]).filter(Boolean))];
  if (!specs.length) return "";
  return specs.join(" / ");
}

function getStoryMasterWidth(story) {
  const first = PEN_MASTER_SPECS[(story.penIds || [])[0]] || "";
  const m = first.match(/^(\d+)\s*×/);
  return m ? Number(m[1]) : 0;

function getStoryVisualFallback(story) {

function isPlainTextBadge(htmlStr) {

function getRulerScaleConfig(z) {
  if (z >= 8.0)  return { minor: 1,  mid: 5,   major: 10  };
  if (z >= 5.0)  return { minor: 1,  mid: 5,   major: 20  };
  if (z >= 3.0)  return { minor: 2,  mid: 10,  major: 20  };
  if (z >= 1.5)  return { minor: 5,  mid: 25,  major: 50  };
  if (z >= 0.75) return { minor: 10, mid: 50,  major: 100 };
  return { minor: 20, mid: 100, major: 200 };
}

function getGridStepConfig(z, snapStep) {
  const step = Number(snapStep) || 1;
  // 最小单位恒为 1px：zoom >= 400% 时平滑显现单像素 (1px) 网格线
  const showPixel = z >= 4.0;
  const pixelAlpha = showPixel ? Math.min(1, Math.max(0.42, (z - 3.0) / 5.0)) : 0;

  if (step === 4) {
    return { showPixel, pixelAlpha, minor: z >= 2.0 ? 4 : 8, major: z >= 1.0 ? 32 : 64 };
  }
  if (step === 8) {
    return { showPixel, pixelAlpha, minor: z >= 1.0 ? 8 : 16, major: 64 };
  }
  if (step === 10) {
    return { showPixel, pixelAlpha, minor: z >= 0.75 ? 10 : 20, major: z >= 2.0 ? 50 : 100 };
  }
  // snapStep === 1：1px 像素底格 + 十进制工程辅助格（与标尺完全对齐）
  if (z >= 6.0)  return { showPixel, pixelAlpha, minor: 10, major: 50 };
  if (z >= 2.0)  return { showPixel, pixelAlpha, minor: 10, major: 50 };
  if (z >= 0.75) return { showPixel, pixelAlpha, minor: 10, major: 100 };
  return { showPixel, pixelAlpha, minor: 20, major: 200 };
}

function applyZoom(nextZoom, isAuto = false) {
  const clamped = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, Math.round(nextZoom * 100) / 100));
  AppState.zoom = clamped;
  AppState.zoomAuto = isAuto;
  updateZoomControlsUI();
  syncZoomPlaneLayout();
  scheduleBlueprintMeasure(60);
}

function stepZoomPreset(dir) {
  const cur = AppState.zoom;
  if (dir > 0) {
    const next = ZOOM_PRESETS.find(p => p > cur + 0.01);
    applyZoom(next ?? ZOOM_PRESETS[ZOOM_PRESETS.length - 1], false);
  } else {
    const prev = [...ZOOM_PRESETS].reverse().find(p => p < cur - 0.01);
    applyZoom(prev ?? ZOOM_PRESETS[0], false);
  }
}

function computeAutoZoom(viewport) {
  if (isVisualFullMode()) return 1;
  const plane = document.getElementById("sb-zoom-plane");
  if (!viewport || !plane) return 1;
  const vpW = viewport.clientWidth || 800;
  const vpH = viewport.clientHeight || 420;
  const hasCtrls = !!document.getElementById("story-controls-slot")?.childElementCount;
  const availW = Math.max(220, vpW - 112);
  const availH = Math.max(160, vpH - (hasCtrls ? 116 : 84));

  const autoPool = [
    0.5, 0.6, 0.7, 0.75, 0.8, 0.85, 0.9,
    1, 1.1, 1.25, 1.4, 1.5, 1.6, 1.75,
    2, 2.25, 2.5, 2.75, 3, 3.5, 4, 4.5, 5, 5.5, 6, 7, 8
  ];

  const pickBestStep = (target, ceiling) => {
    const valid = autoPool.filter(p => p <= ceiling + 0.01);
    if (!valid.length) return autoPool[0];
    let best = valid[0];
    let bestDiff = Math.abs(best - target);
    for (const p of valid) {
      const diff = Math.abs(p - target);
      if (diff < bestDiff - 1e-6 || (Math.abs(diff - bestDiff) < 1e-6 && p > best)) {
        best = p;
        bestDiff = diff;
      }
    }
    return best;
  };

  // 展示 / 状态 / 多端 统一使用同一套等比自动适配缩放引擎
  const natW = Math.max(1, plane.offsetWidth);
  const natH = Math.max(1, plane.offsetHeight);
  const maxFit = Math.min(availW / natW, availH / natH);
  const ratioAt1 = Math.max(natW / vpW, natH / vpH);

  const isSingleSpecimen = AppState.viewTab === "live" ||
    (AppState.viewTab === "hosts" && (AppState.hostSubTab === "gpui" || AppState.hostSubTab === "web"));

  if (isSingleSpecimen) {
    // 光学占比目标：仅针对小组件等比放大至约 30% 视口主轴；中大组件维持 100%，超界自动等比缩小
    const TARGET_AXIS_RATIO = 0.30;
    const MIN_AXIS_RATIO = 0.28;

    if (ratioAt1 >= MIN_AXIS_RATIO) {
      if (maxFit >= 0.98) return 1;
      return pickBestStep(maxFit, maxFit);
    }

    const idealZoom = Math.min(
      (vpW * TARGET_AXIS_RATIO) / natW,
      (vpH * TARGET_AXIS_RATIO) / natH
    );
    const ceiling = Math.min(maxFit, 6.0);
    const clampedTarget = Math.min(idealZoom, ceiling);
    let picked = pickBestStep(clampedTarget, ceiling);

    const occ = Math.max((natW * picked) / vpW, (natH * picked) / vpH);
    if (occ < 0.28) {
      const higher = autoPool.find(p => p > picked && p <= ceiling + 0.01);
      if (higher) picked = higher;
    }
    return picked;
  }

  // 状态 / 多端视图：先按宽高双轴安全边界适配，若小组件整体偏紧凑则按光学比例温和放大
  if (maxFit < 0.98) {
    return pickBestStep(maxFit, maxFit);
  }
  const targetRatio = AppState.viewTab === "states" ? 0.72 : 0.68;
  const maxCap = AppState.viewTab === "states" ? 2.25 : 1.5;
  if (ratioAt1 < targetRatio && maxFit > 1.08) {
    const idealZoom = Math.min((vpW * targetRatio) / natW, (vpH * 0.62) / natH);
    const ceiling = Math.min(maxFit, maxCap);
    if (idealZoom > 1.05 && ceiling > 1.05) {
      return pickBestStep(Math.min(idealZoom, ceiling), ceiling);
    }
  }
  return 1;
}

function collectMeasureTargets(viewport) {
  if (!viewport || isBlueprintSuppressed()) return [];
  const results = [];

  if (AppState.viewTab === "live" || (AppState.viewTab === "hosts" && (AppState.hostSubTab === "gpui" || AppState.hostSubTab === "web"))) {
    const stageSlot = viewport.querySelector(".sb-stage-mount");
    if (!stageSlot) return [];

    const penNodes = Array.from(stageSlot.querySelectorAll("[data-pen-id]")).filter(el => {
      let p = el.parentElement;
      while (p && p !== stageSlot) {
        if (p.hasAttribute("data-pen-id")) return false;
        p = p.parentElement;
      }
      return true;
    });

    for (const el of penNodes) {
      results.push({ el, penId: el.getAttribute("data-pen-id") });
    }
    if (!results.length && stageSlot.firstElementChild) {
      results.push({ el: stageSlot.firstElementChild, penId: "" });
    }

    const openPops = Array.from(stageSlot.querySelectorAll('.pop-surface[data-open="true"]'));
    for (const pop of openPops) {
      if (!results.some(r => r.el === pop)) {
        results.push({ el: pop, penId: pop.getAttribute("data-pen-id") || "", isFloating: true });
      }
    }
  } else if (AppState.viewTab === "states") {
    const cells = Array.from(viewport.querySelectorAll(".sb-state-preview"));
    for (const cell of cells) {
      const target = cell.firstElementChild;
      if (target) results.push({ el: target, penId: "" });
    }
  } else if (AppState.viewTab === "hosts") {
    const specs = Array.from(viewport.querySelectorAll(".sb-host-specimen"));
    for (const sp of specs) {
      const target = sp.firstElementChild;
      if (target) results.push({ el: target, penId: "" });
    }
  }

  return results.filter(({ el }) => {
    const cs = getComputedStyle(el);
    if (cs.display === "none" || cs.visibility === "hidden" || parseFloat(cs.opacity) < 0.05) return false;
    const r = el.getBoundingClientRect();
    return r.width >= 4 && r.height >= 4;
  });
}

function getActiveSpanForRulers() {
  const viewport = document.getElementById("sb-viewport");
  if (!viewport || !lastMeasuredTargets.length) return currentPrimarySpan;
  const idx = hoveredTargetIdx >= 0 && hoveredTargetIdx < lastMeasuredTargets.length ? hoveredTargetIdx : 0;
  const t = lastMeasuredTargets[idx];
  const sL = viewport.scrollLeft;
  const sT = viewport.scrollTop;
  const baseOx = currentPrimarySpan ? currentPrimarySpan.ox : (t.x - sL);
  const baseOy = currentPrimarySpan ? currentPrimarySpan.oy : (t.y - sT);
  return {
    ox: baseOx,
    oy: baseOy,
    x0: t.x - sL,
    x1: t.x - sL + t.w,
    y0: t.y - sT,
    y1: t.y - sT + t.h,
    lw: t.lw,
    lh: t.lh
  };
}

function drawPixelGrid() {
  const canvas = document.getElementById("sb-grid-canvas");
  const viewport = document.getElementById("sb-viewport");
  if (!canvas || !viewport) return;

  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  if (w <= 0 || h <= 0) return;

  const dpr = window.devicePixelRatio || 1;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  if (isBlueprintSuppressed()) return;

  const z = AppState.zoom || 1;
  const span = currentPrimarySpan;
  const ox = span ? span.ox : (56 - viewport.scrollLeft + AppState.panX);
  const oy = span ? span.oy : (48 - viewport.scrollTop + AppState.panY);
  const cs = getComputedStyle(document.documentElement);

  if (AppState.showGrid) {
    const cfg = getGridStepConfig(z, AppState.snapStep);
    const pixCol = cs.getPropertyValue("--grid-pixel").trim() || "rgba(17,17,20,0.055)";
    const minorCol = cs.getPropertyValue("--grid-minor").trim() || "rgba(17,17,20,0.065)";
    const majorCol = cs.getPropertyValue("--grid-major").trim() || "rgba(17,17,20,0.13)";
    const originCol = cs.getPropertyValue("--grid-origin").trim() || "rgba(26,75,224,0.24)";

    const drawGridLines = (stepLogical, color, skipMultiple, alpha = 1) => {
      const stepPx = stepLogical * z;
      if (stepPx < 3.5) return;
      const startX = Math.floor((-ox) / stepPx) * stepLogical;
      const endX = Math.ceil((w - ox) / stepPx) * stepLogical;
      const startY = Math.floor((-oy) / stepPx) * stepLogical;
      const endY = Math.ceil((h - oy) / stepPx) * stepLogical;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let vx = startX; vx <= endX; vx += stepLogical) {
        if (vx === 0) continue;
        if (skipMultiple && vx % skipMultiple === 0) continue;
        const sx = Math.round(ox + vx * z) + 0.5;
        if (sx < -1 || sx > w + 1) continue;
        ctx.moveTo(sx, 0);
        ctx.lineTo(sx, h);
      }
      for (let vy = startY; vy <= endY; vy += stepLogical) {
        if (vy === 0) continue;
        if (skipMultiple && vy % skipMultiple === 0) continue;
        const sy = Math.round(oy + vy * z) + 0.5;
        if (sy < -1 || sy > h + 1) continue;
        ctx.moveTo(0, sy);
        ctx.lineTo(w, sy);
      }
      ctx.stroke();
      ctx.restore();
    };

    // 1. 最小单位 1px 像素网格 (zoom >= 400% 时平滑浮现)
    if (cfg.showPixel) {
      drawGridLines(1, pixCol, cfg.minor, cfg.pixelAlpha);
    }
    // 2. 次级吸附网格
    drawGridLines(cfg.minor, minorCol, cfg.major, 1);
    // 3. 主网格线
    drawGridLines(cfg.major, majorCol, 0, 1);

    // 4. 逻辑原点坐标轴 (x = 0, y = 0)
    const oxPx = Math.round(ox) + 0.5;
    const oyPx = Math.round(oy) + 0.5;
    ctx.save();
    ctx.strokeStyle = originCol;
    ctx.lineWidth = 1;
    ctx.beginPath();
    if (oxPx >= 0 && oxPx <= w) { ctx.moveTo(oxPx, 0); ctx.lineTo(oxPx, h); }
    if (oyPx >= 0 && oyPx <= h) { ctx.moveTo(0, oyPx); ctx.lineTo(w, oyPx); }
    ctx.stroke();
    // 原点小十字准星
    if (oxPx >= -8 && oxPx <= w + 8 && oyPx >= -8 && oyPx <= h + 8) {
      ctx.strokeStyle = cs.getPropertyValue("--ruler-span-edge").trim() || "#2563EB";
      ctx.beginPath();
      ctx.moveTo(oxPx - 5, oyPx);
      ctx.lineTo(oxPx + 5, oyPx);
      ctx.moveTo(oxPx, oyPx - 5);
      ctx.lineTo(oxPx, oyPx + 5);
      ctx.stroke();
    }
    ctx.restore();
  }

  // 5. 拖拽组件时的磁吸对齐线与原点位移虚线
  if (isDraggingComponent) {
    const snapCol = cs.getPropertyValue("--snap-guide").trim() || "#2563EB";
    ctx.save();
    ctx.strokeStyle = snapCol;
    ctx.lineWidth = 1;

    if (activeSnapState.x !== null) {
      const sx = Math.round(ox + activeSnapState.x * z) + 0.5;
      if (sx >= 0 && sx <= w) {
        ctx.beginPath();
        ctx.moveTo(sx, 0);
        ctx.lineTo(sx, h);
        ctx.stroke();
      }
    }
    if (activeSnapState.y !== null) {
      const sy = Math.round(oy + activeSnapState.y * z) + 0.5;
      if (sy >= 0 && sy <= h) {
        ctx.beginPath();
        ctx.moveTo(0, sy);
        ctx.lineTo(w, sy);
        ctx.stroke();
      }
    }

    // 从原点 (0, 0) 到当前组件左上角 (compX, compY) 的位移参考虚线
    if (AppState.compX !== 0 || AppState.compY !== 0) {
      const oxPx = Math.round(ox) + 0.5;
      const oyPx = Math.round(oy) + 0.5;
      const cxPx = Math.round(ox + AppState.compX * z) + 0.5;
      const cyPx = Math.round(oy + AppState.compY * z) + 0.5;
      ctx.setLineDash([3, 3]);
      ctx.globalAlpha = 0.65;
      ctx.beginPath();
      ctx.moveTo(oxPx, oyPx);
      ctx.lineTo(cxPx, oyPx);
      ctx.lineTo(cxPx, cyPx);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function computeComponentSnap(rawX, rawY, bypassMagnet = false) {
  const z = AppState.zoom || 1;
  const primary = lastMeasuredTargets[0];
  const compW = primary ? primary.lw : 0;
  const compH = primary ? primary.lh : 0;

  // 基础分辨率恒为最小单位 1px 整数像素
  let x = Math.round(rawX);
  let y = Math.round(rawY);
  let snapX = null;
  let snapY = null;
  let labelX = "";
  let labelY = "";

  if (!AppState.snapEnabled || bypassMagnet) {
    return { x, y, snapX: null, snapY: null, label: "自由 1px" };
  }

  const originTol = Math.max(1.5, 7 / z);
  const step = Number(AppState.snapStep) || 1;
  const gridCfg = getGridStepConfig(z, step);

  // X 轴磁吸：优先吸附原点 (左沿=0 / 中线=0 / 右沿=0)，其次按步进吸附网格
  if (Math.abs(rawX) <= originTol) {
    x = 0; snapX = 0; labelX = "原点 X";
  } else if (compW > 0 && Math.abs(rawX + compW) <= originTol) {
    x = -compW; snapX = 0; labelX = "右沿对齐 X=0";
  } else if (compW > 0 && Math.abs(rawX + compW / 2) <= originTol) {
    x = Math.round(-compW / 2); snapX = 0; labelX = "中线对齐 X=0";
  } else if (step > 1) {
    x = Math.round(rawX / step) * step;
    snapX = x;
    labelX = `${step}px`;
  } else {
    // step === 1：默认 1px 步进，低缩放下对主网格线提供轻磁吸
    const major = gridCfg.major;
    const nearestMajor = Math.round(rawX / major) * major;
    const majorTol = z < 6 ? Math.max(1, 4.5 / z) : 0;
    if (majorTol > 0 && Math.abs(rawX - nearestMajor) <= majorTol) {
      x = nearestMajor; snapX = nearestMajor; labelX = `主网格 ${major}px`;
    } else {
      x = Math.round(rawX);
      snapX = z >= 4 ? x : null;
      labelX = "1px";
    }
  }

  // Y 轴磁吸：优先吸附原点 (顶沿=0 / 中线=0 / 底沿=0)，其次按步进吸附网格
  if (Math.abs(rawY) <= originTol) {
    y = 0; snapY = 0; labelY = "原点 Y";
  } else if (compH > 0 && Math.abs(rawY + compH) <= originTol) {
    y = -compH; snapY = 0; labelY = "底沿对齐 Y=0";
  } else if (compH > 0 && Math.abs(rawY + compH / 2) <= originTol) {
    y = Math.round(-compH / 2); snapY = 0; labelY = "中线对齐 Y=0";
  } else if (step > 1) {
    y = Math.round(rawY / step) * step;
    snapY = y;
    labelY = `${step}px`;
  } else {
    const major = gridCfg.major;
    const nearestMajor = Math.round(rawY / major) * major;
    const majorTol = z < 6 ? Math.max(1, 4.5 / z) : 0;
    if (majorTol > 0 && Math.abs(rawY - nearestMajor) <= majorTol) {
      y = nearestMajor; snapY = nearestMajor; labelY = `主网格 ${major}px`;
    } else {
      y = Math.round(rawY);
      snapY = z >= 4 ? y : null;
      labelY = "1px";
    }
  }

  let label = "";
  if (snapX === 0 && snapY === 0) label = "吸附原点 (0,0)";
  else if (snapX === 0 || snapY === 0) label = snapX === 0 ? labelX : labelY;
  else if (step > 1) label = `吸附 ${step}px`;
  else if (labelX.startsWith("主网格") || labelY.startsWith("主网格")) label = "吸附主网格";
  else label = "吸附 1px";

  return { x, y, snapX, snapY, label };
}

function updateDragBadge(visible, tagText = "") {
  const badge = document.getElementById("sb-drag-badge");
  const wrap = document.getElementById("sb-viewport-wrap");
  if (!badge || !wrap) return;
  if (!visible) {
    badge.dataset.visible = "false";
    return;
  }
  const sx = AppState.compX >= 0 ? `+${AppState.compX}` : `${AppState.compX}`;
  const sy = AppState.compY >= 0 ? `+${AppState.compY}` : `${AppState.compY}`;
  badge.innerHTML = `<span>X ${sx}px · Y ${sy}px</span>${tagText ? `<span class="sb-drag-badge-tag">${escapeHtml(tagText)}</span>` : ""}`;
  badge.dataset.visible = "true";

  const span = currentPrimarySpan;
  const wrapW = wrap.clientWidth || 600;
  const bx = span ? Math.max(10, Math.min(wrapW - 220, Math.round(span.x0))) : 16;
  const by = span ? Math.max(10, Math.round(span.y0 - 46)) : 16;
  badge.style.transform = `translate3d(${bx}px, ${by}px, 0)`;
}

function drawRulers() {
  if (AppState.rulerMode === "off" || isBlueprintSuppressed()) return;

  const topCanvas = document.getElementById("sb-ruler-top");
  const leftCanvas = document.getElementById("sb-ruler-left");
  const viewport = document.getElementById("sb-viewport");
  if (!topCanvas || !leftCanvas || !viewport) return;

  const z = AppState.zoom || 1;
  const stepCfg = getRulerScaleConfig(z);
  const span = getActiveSpanForRulers();
  const dpr = window.devicePixelRatio || 1;
  const cs = getComputedStyle(document.documentElement);
  const bg = cs.getPropertyValue("--ruler-bg").trim() || "#FAFAFB";
  const tickCol = cs.getPropertyValue("--ruler-tick").trim() || "rgba(17,17,20,0.22)";
  const majorCol = cs.getPropertyValue("--ruler-tick-major").trim() || "rgba(17,17,20,0.45)";
  const txtCol = cs.getPropertyValue("--ruler-text").trim() || "#71717A";
  const spanBg = cs.getPropertyValue("--ruler-span-bg").trim() || "rgba(26,75,224,0.09)";
  const spanEdge = cs.getPropertyValue("--ruler-span-edge").trim() || "#1A4BE0";

  const ox = span ? span.ox : (56 - viewport.scrollLeft);
  const oy = span ? span.oy : (48 - viewport.scrollTop);

  // 顶部水平标尺 (等比缩放刻度 + 跨度精确像素读数)
  const tw = topCanvas.clientWidth;
  const th = topCanvas.clientHeight;
  if (tw > 0 && th > 0) {
    if (topCanvas.width !== Math.round(tw * dpr) || topCanvas.height !== Math.round(th * dpr)) {
      topCanvas.width = Math.round(tw * dpr);
      topCanvas.height = Math.round(th * dpr);
    }
    const ctx = topCanvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, tw, th);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, tw, th);

    let spanLabelBox = null;
    if (span) {
      const sx0 = Math.max(0, span.x0);
      const sx1 = Math.min(tw, span.x1);
      if (sx1 > sx0) {
        ctx.fillStyle = spanBg;
        ctx.fillRect(sx0, 0, sx1 - sx0, th);
      }
      ctx.strokeStyle = spanEdge;
      ctx.lineWidth = 1;
      for (const ex of [span.x0, span.x1]) {
        if (ex >= 0 && ex <= tw) {
          ctx.beginPath();
          ctx.moveTo(Math.round(ex) + 0.5, 0);
          ctx.lineTo(Math.round(ex) + 0.5, th);
          ctx.stroke();
        }
      }
      ctx.font = '600 10px "JetBrains Mono", Consolas, monospace';
      const dimTxt = `${span.lw}px`;
      const dimW = ctx.measureText(dimTxt).width;
      const spanScreenW = span.x1 - span.x0;
      let tx = spanScreenW >= dimW + 12
        ? (span.x0 + span.x1) / 2 - dimW / 2
        : span.x1 + 5;
      if (tx + dimW > tw - 4) tx = span.x0 - dimW - 5;
      if (tx >= 2 && tx + dimW <= tw - 2) {
        spanLabelBox = [tx - 4, tx + dimW + 4];
        ctx.fillStyle = spanEdge;
        ctx.textBaseline = "top";
        ctx.fillText(dimTxt, tx, 3);
      }
    }

    ctx.font = '10px "JetBrains Mono", Consolas, monospace';
    ctx.textBaseline = "top";
    const startVal = Math.floor((-ox) / (stepCfg.minor * z)) * stepCfg.minor;
    const endVal = Math.ceil((tw - ox) / (stepCfg.minor * z)) * stepCfg.minor;
    for (let v = startVal; v <= endVal; v += stepCfg.minor) {
      const px = Math.round(ox + v * z) + 0.5;
      if (px < 0 || px > tw) continue;
      const isMajor = v % stepCfg.major === 0;
      const isMid = !isMajor && v % stepCfg.mid === 0;
      const tickH = isMajor ? 10 : isMid ? 6 : 3.5;
      ctx.strokeStyle = isMajor ? majorCol : tickCol;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(px, th - tickH);
      ctx.lineTo(px, th);
      ctx.stroke();
      if (isMajor) {
        const lbl = String(v);
        const lx = px + 3;
        const lwTxt = ctx.measureText(lbl).width;
        const overlapsSpan = spanLabelBox && !(lx + lwTxt < spanLabelBox[0] || lx > spanLabelBox[1]);
        const touchesEdge = span && v !== 0 && (lx - 2 < span.x1 && lx + lwTxt + 2 > span.x1);
        if (!overlapsSpan && !touchesEdge) {
          ctx.fillStyle = v === 0 && span ? spanEdge : txtCol;
          ctx.fillText(lbl, lx, 3);
        }
      }
    }

    if (pointerInVp) {
      const cx = Math.round(pointerInVp.x) + 0.5;
      ctx.strokeStyle = spanEdge;
      ctx.beginPath();
      ctx.moveTo(cx, 0);
      ctx.lineTo(cx, th);
      ctx.stroke();
    }
  }

  // 左侧垂直标尺 (等比缩放刻度 + 跨度精确像素读数)
  const lw = leftCanvas.clientWidth;
  const lh = leftCanvas.clientHeight;
  if (lw > 0 && lh > 0) {
    if (leftCanvas.width !== Math.round(lw * dpr) || leftCanvas.height !== Math.round(lh * dpr)) {
      leftCanvas.width = Math.round(lw * dpr);
      leftCanvas.height = Math.round(lh * dpr);
    }
    const ctx = leftCanvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, lw, lh);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, lw, lh);

    let spanLabelBoxY = null;
    if (span) {
      const sy0 = Math.max(0, span.y0);
      const sy1 = Math.min(lh, span.y1);
      if (sy1 > sy0) {
        ctx.fillStyle = spanBg;
        ctx.fillRect(0, sy0, lw, sy1 - sy0);
      }
      ctx.strokeStyle = spanEdge;
      ctx.lineWidth = 1;
      for (const ey of [span.y0, span.y1]) {
        if (ey >= 0 && ey <= lh) {
          ctx.beginPath();
          ctx.moveTo(0, Math.round(ey) + 0.5);
          ctx.lineTo(lw, Math.round(ey) + 0.5);
          ctx.stroke();
        }
      }
      ctx.font = '600 10px "JetBrains Mono", Consolas, monospace';
      const dimTxt = `${span.lh}px`;
      const dimLen = ctx.measureText(dimTxt).width;
      const spanScreenH = span.y1 - span.y0;
      let tyBottom = spanScreenH >= dimLen + 10
        ? (span.y0 + span.y1) / 2 + dimLen / 2
        : span.y1 + dimLen + 5;
      if (tyBottom > lh - 4) tyBottom = span.y0 - 5;
      if (tyBottom - dimLen >= 2 && tyBottom <= lh - 2) {
        spanLabelBoxY = [tyBottom - dimLen - 4, tyBottom + 4];
        ctx.save();
        ctx.fillStyle = spanEdge;
        ctx.translate(3, tyBottom);
        ctx.rotate(-Math.PI / 2);
        ctx.textBaseline = "top";
        ctx.fillText(dimTxt, 0, 0);
        ctx.restore();
      }
    }

    ctx.font = '10px "JetBrains Mono", Consolas, monospace';
    const startVal = Math.floor((-oy) / (stepCfg.minor * z)) * stepCfg.minor;
    const endVal = Math.ceil((lh - oy) / (stepCfg.minor * z)) * stepCfg.minor;
    for (let v = startVal; v <= endVal; v += stepCfg.minor) {
      const py = Math.round(oy + v * z) + 0.5;
      if (py < 0 || py > lh) continue;
      const isMajor = v % stepCfg.major === 0;
      const isMid = !isMajor && v % stepCfg.mid === 0;
      const tickW = isMajor ? 10 : isMid ? 6 : 3.5;
      ctx.strokeStyle = isMajor ? majorCol : tickCol;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(lw - tickW, py);
      ctx.lineTo(lw, py);
      ctx.stroke();
      if (isMajor) {
        const lbl = String(v);
        const lblLen = ctx.measureText(lbl).width;
        const yBot = py - 3;
        const yTop = yBot - lblLen;
        const overlapsSpan = spanLabelBoxY && !(yBot < spanLabelBoxY[0] || yTop > spanLabelBoxY[1]);
        const touchesEdge = span && ((v !== 0 && Math.abs(py - span.y1) < 6));
        if (!overlapsSpan && !touchesEdge && yTop >= 2) {
          ctx.save();
          ctx.fillStyle = v === 0 && span ? spanEdge : txtCol;
          ctx.translate(3, yBot);
          ctx.rotate(-Math.PI / 2);
          ctx.textBaseline = "top";
          ctx.fillText(lbl, 0, 0);
          ctx.restore();
        }
      }
    }

    if (pointerInVp) {
      const cy = Math.round(pointerInVp.y) + 0.5;
      ctx.strokeStyle = spanEdge;
      ctx.beginPath();
      ctx.moveTo(0, cy);
      ctx.lineTo(lw, cy);
      ctx.stroke();
    }
  }
}

function updateHoverHighlightState() {
  const stage = document.getElementById("sb-ruler-stage");
  const viewport = document.getElementById("sb-viewport");
  if (!viewport) return;

  let nextIdx = -1;
  if (pointerInVp && lastMeasuredTargets.length) {
    const vx = pointerInVp.x + viewport.scrollLeft;
    const vy = pointerInVp.y + viewport.scrollTop;
    const pad = 20;
    for (let i = 0; i < lastMeasuredTargets.length; i++) {
      const t = lastMeasuredTargets[i];
      if (vx >= t.x - pad && vx <= t.x + t.w + pad && vy >= t.y - pad && vy <= t.y + t.h + pad) {
        nextIdx = i;
        break;
      }
    }
  }

  const prevIdx = hoveredTargetIdx;
  hoveredTargetIdx = nextIdx;

  if (stage) {
    stage.classList.toggle("is-ruler-active", hoveredTargetIdx >= 0 || hoveringRuler);
  }

  const overlay = viewport.querySelector(".sb-dim-overlay");
  if (overlay) {
    overlay.querySelectorAll(".cad-target-group, .cad-pill").forEach(el => {
      const idx = Number(el.dataset.idx);
      const active = (hoveredTargetIdx === idx) || (hoveringRuler && idx === 0);
      el.classList.toggle("is-hovered", active);
    });
  }

  if (prevIdx !== hoveredTargetIdx && AppState.viewTab !== "live") {
    renderBlueprintOverlay();
  } else {
    drawRulers();
  }
}

function renderBlueprintOverlay() {
  const viewport = document.getElementById("sb-viewport");
  if (!viewport) return;

  syncZoomPlaneLayout();

  let overlay = viewport.querySelector(".sb-dim-overlay");
  if (!overlay) {
    overlay = document.createElement("div");
    overlay.className = "sb-dim-overlay";
    viewport.appendChild(overlay);
  }

  const z = AppState.zoom || 1;
  const vpRect = viewport.getBoundingClientRect();
  const sL = viewport.scrollLeft;
  const sT = viewport.scrollTop;
  const targets = collectMeasureTargets(viewport);

  if (!targets.length) {
    lastMeasuredTargets = [];
    currentPrimarySpan = null;
    hoveredTargetIdx = -1;
    overlay.innerHTML = "";
    drawPixelGrid();
    drawRulers();
    return;
  }

  const measured = targets.map(t => {
    const r = t.el.getBoundingClientRect();
    const rawLeft = r.left - vpRect.left;
    const rawTop = r.top - vpRect.top;
    return {
      ...t,
      rawLeft,
      rawTop,
      x: Math.round(rawLeft + sL),
      y: Math.round(rawTop + sT),
      w: Math.round(r.width),
      h: Math.round(r.height),
      lw: Math.round(r.width / z),
      lh: Math.round(r.height / z)
    };
  });
  lastMeasuredTargets = measured;

  const primary = measured[0];
  const originX = primary.rawLeft - AppState.compX * z;
  const originY = primary.rawTop - AppState.compY * z;
  currentPrimarySpan = {
    ox: originX,
    oy: originY,
    x0: primary.rawLeft,
    x1: primary.rawLeft + primary.w,
    y0: primary.rawTop,
    y1: primary.rawTop + primary.h,
    lw: primary.lw,
    lh: primary.lh
  };

  drawPixelGrid();

  if (AppState.rulerMode === "off") {
    overlay.innerHTML = "";
    return;
  }

  const projIdx = hoveredTargetIdx >= 0 && hoveredTargetIdx < measured.length ? hoveredTargetIdx : 0;
  let svgParts = [];
  let labelParts = [];

  measured.forEach((m, idx) => {
    const x0 = m.x + 0.5;
    const x1 = m.x + m.w - 0.5;
    const y0 = m.y + 0.5;
    const y1 = m.y + m.h - 0.5;
    const isHov = (hoveredTargetIdx === idx) || (hoveringRuler && idx === 0);

    let gInner = "";
    // 1. 组件外框虚线参考框
    gInner += `<rect x="${x0}" y="${y0}" width="${Math.max(1, m.w - 1)}" height="${Math.max(1, m.h - 1)}" fill="none" stroke="var(--cad-box)" stroke-width="1" stroke-dasharray="3 3" />`;

    // 2. 向顶部与左侧标尺投射延伸参考线
    if (idx === projIdx) {
      gInner += `
        <line x1="0" y1="${y0}" x2="${x0}" y2="${y0}" stroke="var(--cad-proj)" stroke-width="1" stroke-dasharray="3 3" />
        <line x1="0" y1="${y1}" x2="${x0}" y2="${y1}" stroke="var(--cad-proj)" stroke-width="1" stroke-dasharray="3 3" />
        <line x1="${x0}" y1="0" x2="${x0}" y2="${y0}" stroke="var(--cad-proj)" stroke-width="1" stroke-dasharray="3 3" />
        <line x1="${x1}" y1="0" x2="${x1}" y2="${y0}" stroke="var(--cad-proj)" stroke-width="1" stroke-dasharray="3 3" />
      `;
    }

    // 3. 顶部与右侧测距标尺线（常态纯线，悬停时显现逻辑像素数值）
    const yd = m.y - 12 + 0.5;
    const xd = m.x + m.w + 12 + 0.5;
    gInner += `
      <line x1="${x0}" y1="${y0}" x2="${x0}" y2="${yd - 3}" stroke="var(--cad-guide)" stroke-width="1" stroke-dasharray="2 2" />
      <line x1="${x1}" y1="${y0}" x2="${x1}" y2="${yd - 3}" stroke="var(--cad-guide)" stroke-width="1" stroke-dasharray="2 2" />
      <line x1="${x0}" y1="${yd}" x2="${x1}" y2="${yd}" stroke="var(--cad-line)" stroke-width="1" />
      <line x1="${x0}" y1="${yd - 3}" x2="${x0}" y2="${yd + 3}" stroke="var(--cad-line)" stroke-width="1" />
      <line x1="${x1}" y1="${yd - 3}" x2="${x1}" y2="${yd + 3}" stroke="var(--cad-line)" stroke-width="1" />

      <line x1="${x1}" y1="${y0}" x2="${xd + 3}" y2="${y0}" stroke="var(--cad-guide)" stroke-width="1" stroke-dasharray="2 2" />
      <line x1="${x1}" y1="${y1}" x2="${xd + 3}" y2="${y1}" stroke="var(--cad-guide)" stroke-width="1" stroke-dasharray="2 2" />
      <line x1="${xd}" y1="${y0}" x2="${xd}" y2="${y1}" stroke="var(--cad-line)" stroke-width="1" />
      <line x1="${xd - 3}" y1="${y0}" x2="${xd + 3}" y2="${y0}" stroke="var(--cad-line)" stroke-width="1" />
      <line x1="${xd - 3}" y1="${y1}" x2="${xd + 3}" y2="${y1}" stroke="var(--cad-line)" stroke-width="1" />
    `;
    if (m.w >= 20) {
      gInner += `
        <polyline points="${x0 + 3},${yd - 2.5} ${x0},${yd} ${x0 + 3},${yd + 2.5}" fill="none" stroke="var(--cad-line)" stroke-width="1" />
        <polyline points="${x1 - 3},${yd - 2.5} ${x1},${yd} ${x1 - 3},${yd + 2.5}" fill="none" stroke="var(--cad-line)" stroke-width="1" />
      `;
    }
    if (m.h >= 20) {
      gInner += `
        <polyline points="${xd - 2.5},${y0 + 3} ${xd},${y0} ${xd + 2.5},${y0 + 3}" fill="none" stroke="var(--cad-line)" stroke-width="1" />
        <polyline points="${xd - 2.5},${y1 - 3} ${xd},${y1} ${xd + 2.5},${y1 - 3}" fill="none" stroke="var(--cad-line)" stroke-width="1" />
      `;
    }

    const hovCls = isHov ? " is-hovered" : "";
    const wLabelY = m.w >= 64 ? (m.y - 12) : (m.y - 25);
    labelParts.push(`<span class="cad-pill${hovCls}" data-idx="${idx}" style="left:${m.x + m.w / 2}px;top:${wLabelY}px;transform:translate(-50%,-50%);">${m.lw} px</span>`);
    if (m.h >= 52) {
      labelParts.push(`<span class="cad-pill${hovCls}" data-idx="${idx}" style="left:${m.x + m.w + 12}px;top:${m.y + m.h / 2}px;transform:translate(-50%,-50%);">${m.lh} px</span>`);
    } else {
      labelParts.push(`<span class="cad-pill${hovCls}" data-idx="${idx}" style="left:${m.x + m.w + 20}px;top:${m.y + m.h / 2}px;transform:translateY(-50%);">${m.lh} px</span>`);
    }

    svgParts.push(`<g class="cad-target-group${hovCls}" data-idx="${idx}">${gInner}</g>`);
  });

  overlay.innerHTML = `<svg width="1" height="1" style="position:absolute;top:0;left:0;overflow:visible;">${svgParts.join("")}</svg>${labelParts.join("")}`;
  drawRulers();
}

function scheduleBlueprintMeasure(followMs = 0) {
  if (followMs > 0) {
    followUntilTs = Math.max(followUntilTs, performance.now() + followMs);
  }
  if (measureRafId) return;
  const step = () => {
    measureRafId = 0;
    renderBlueprintOverlay();
    if (performance.now() < followUntilTs) {
      measureRafId = requestAnimationFrame(step);
    }
  };
  measureRafId = requestAnimationFrame(step);
}

function bindStageMeasurement(viewport) {
  disconnectMeasureObservers();
  if (!viewport) return;

  const plane = viewport.querySelector("#sb-zoom-plane");
  const contentRoot = plane || viewport.firstElementChild;
  if (contentRoot && !contentRoot.classList.contains("sb-dim-overlay")) {
    measureResizeObs = new ResizeObserver(() => scheduleBlueprintMeasure(80));
    measureResizeObs.observe(contentRoot);
    contentRoot.querySelectorAll("[data-pen-id], .sb-state-preview, .sb-host-specimen").forEach(el => {
      measureResizeObs.observe(el);
    });

    measureMutObs = new MutationObserver(() => {
      if (measureResizeObs) {
        contentRoot.querySelectorAll("[data-pen-id], .pop-surface").forEach(el => measureResizeObs.observe(el));
      }
      scheduleBlueprintMeasure(360);
    });
    measureMutObs.observe(contentRoot, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeFilter: ["data-open", "data-pen-id", "data-expanded", "data-checked", "style", "class"]
    });
  }

  scheduleBlueprintMeasure(180);
}

let pendingFocusToken = null;

function jumpToDesignToken(tokenName) {
  pendingFocusToken = tokenName || null;
  navigateToStory("tokens", true);
}

function buildAgentStoryMarkdown(story) {
  const specs = COMPONENT_SPECS[story.id] || [];
  const motionKeys = AGENT_SPEC.storyMotionMap[story.id] || [];
  const motionLines = motionKeys.map(k => {
    const p = AGENT_SPEC.motion.primitives[k];
    return p ? `- \`${k}\`: ${JSON.stringify(p)}` : `- \`${k}\``;
  });
  return [
    `## ${story.en} (${story.zh})`,
    `- **Story ID**: \`${story.id}\` | **Category**: \`${story.category}\` | **Pen Masters**: ${(story.penIds || []).map(p => `\`${p}\``).join(", ") || "—"}`,
    ...(story.meta || []).map(([k, v]) => `- **${k}**: ${v}`),
    ...specs.map(([k, v]) => `- **${k}**: ${v}`),
    ...(motionLines.length ? ["### Motion Primitives", ...motionLines] : []),
    "### Interaction Contracts",
    ...(story.contracts || []).map(([t, b, bd]) => `- **${t}**: ${b}${bd ? `（边界：${bd}）` : ""}`),
    "### Hosts",
    `- **GPUI**: ${story.hosts?.gpui?.note || "—"}`,
    `- **Web**: ${story.hosts?.web?.note || "—"}`
  ].join("\n");
}

function renderSpecPanel(story, targetEl = null) {
  const panel = targetEl || document.getElementById("sb-spec-panel");
  if (!panel) return;
  if (!story) {
    panel.innerHTML = "";
    return;
  }

  const specs = COMPONENT_SPECS[story.id] || [];
  const motionKeys = AGENT_SPEC.storyMotionMap[story.id] || [];
  const isMotion = story.kind === "motion";
  const penBtns = (story.penIds || []).length
    ? (story.penIds || []).map(pid =>
      `<button type="button" class="sb-node-id" data-copy-pen="${escapeHtml(pid)}" title="点击复制 Pen 参考节点 ID">${escapeHtml(pid)}</button>`
    ).join("")
    : `<span style="color:var(--text-muted);font-size:13.5px;">交互侧动效规范（不属于 .pen 静态母版）</span>`;
  const primMap = AGENT_SPEC.motion.primitiveToStory || {};
  const motionChips = motionKeys.length
    ? motionKeys.map(k => {
      const target = primMap[k];
      if (target && target !== story.id) {
        return `<button type="button" class="tok-chip" data-jump-motion="${escapeHtml(target)}" title="跳转查看「${escapeHtml(k)}」对应动效曲线与示例">${escapeHtml(k)}</button>`;
      }
      return `<span class="tok-chip" style="cursor:default;">${escapeHtml(k)}</span>`;
    }).join("")
    : `<span style="color:var(--text-muted);font-size:13.5px;">静态（无动效）</span>`;

  panel.innerHTML = `
    <div class="sb-spec-layout">
      <div class="sb-spec-col-meta">
        <div class="sb-spec-col-head">
          <span>${isMotion ? "动效参数与映射" : "基础规格"}</span>
          <span style="display:inline-flex;align-items:center;gap:12px;">
            <button type="button" class="btn-ghost" id="sb-copy-agent-spec" style="height:26px;font-size:13px;gap:5px;" title="复制此项的结构化 Markdown 规范供 Agent 参考">
              ${icon("copy", 13)}<span>复制规范</span>
            </button>
            <button type="button" class="ext-link" id="sb-open-tokens-link" style="font-size:14.5px;font-weight:400;">
              <span>设计令牌说明</span>${icon("arrow-up-right", 15)}
            </button>
          </span>
        </div>
        <div class="sb-kv-list">
          ${isMotion ? "" : `
          <div class="sb-kv-row">
            <span class="sb-kv-label">参考节点</span>
            <div class="sb-kv-val is-nodes">${penBtns}</div>
          </div>`}
          <div class="sb-kv-row">
            <span class="sb-kv-label">${isMotion ? "原语" : "绑定动效"}</span>
            <div class="sb-kv-val is-nodes">${motionChips}</div>
          </div>
          ${specs.map(([k, v]) => `
            <div class="sb-kv-row">
              <span class="sb-kv-label">${escapeHtml(k)}</span>
              <div class="sb-kv-val">${renderSpecText(v)}</div>
            </div>
          `).join("")}
        </div>
      </div>

      <div class="sb-spec-col-rules">
        <div class="sb-spec-col-head"><span>${isMotion ? "动效契约与边界" : "交互说明"}</span></div>
        <div class="sb-rule-list">
          ${(story.contracts || []).map(([title, body, bound]) => `
            <div class="sb-rule-item">
              <div class="sb-rule-title">${escapeHtml(title)}</div>
              <div class="sb-rule-body">${renderSpecText(body)}</div>
              ${bound ? `<div class="sb-rule-bound">边界：${renderSpecText(bound)}</div>` : ""}
            </div>
          `).join("")}
        </div>
      </div>
    </div>
  `;

  panel.querySelectorAll("[data-copy-pen]").forEach(b => {
    b.addEventListener("click", () => {
      navigator.clipboard?.writeText(b.dataset.copyPen).catch(() => {});
      showToast({ text: `已复制参考节点: ${b.dataset.copyPen}`, ignoreSlow: true });
    });
  });
  panel.querySelectorAll("[data-jump-motion]").forEach(b => {
    b.addEventListener("click", () => navigateToStory(b.dataset.jumpMotion, true, true));
  });
  panel.querySelectorAll("[data-jump-token]").forEach(b => {
    b.addEventListener("click", () => jumpToDesignToken(b.dataset.jumpToken));
  });
  panel.querySelector("#sb-copy-agent-spec")?.addEventListener("click", () => {
    const md = buildAgentStoryMarkdown(story);
    navigator.clipboard?.writeText(md).catch(() => {});
    showToast({ text: `已复制「${story.zh}」Agent 规范`, ignoreSlow: true });
  });
  panel.querySelector("#sb-open-tokens-link")?.addEventListener("click", () => jumpToDesignToken(null));
}

              } else if (it.type === "border") {
                previewHtml = `<span class="sb-tok-preview is-border" style="border-color:var(${it.cssVar});"></span>`;
              } else if (it.type === "shadow") {
                const bg = it.token.includes("accent") ? "var(--accent-solid)" : it.token.includes("danger") ? "var(--status-danger)" : "var(--bg-workspace)";
                previewHtml = `<span class="sb-tok-preview" style="background:${bg};border-color:var(--border-strong);box-shadow:var(${it.cssVar});"></span>`;

    const targetTok = pendingFocusToken;

      const row = viewport.querySelector(`[data-token-row="${CSS.escape(targetTok)}"]`);

        row.classList.add("tok-flash");
        setTimeout(() => row.classList.remove("tok-flash"), 1600);
      }
    });
  }

  bindStageMeasurement(viewport);
}

function clearStoryRuntime() {
  disconnectMeasureObservers();
  while (AppState.cleanups.length) {
    const fn = AppState.cleanups.pop();
    try { fn(); } catch {}
  }
  outsideWatchers = [];
  AppState.activeRunningLights = [];
  AppState.activeShaderController = null;
  lastMeasuredTargets = [];
  hoveredTargetIdx = -1;
  while (AppState.focusStack.length > 1) {
    AppState.focusStack.pop();
  }
  syncFocusStackUI();
  const controlsSlot = document.getElementById("story-controls-slot");
  if (controlsSlot) controlsSlot.innerHTML = "";
}

function getCategoryStories(catCode, query = "") {
  return STORIES
    .filter(s => s.category === catCode && (
      !query ||
      s.zh.toLowerCase().includes(query) ||
      s.en.toLowerCase().includes(query) ||
      s.id.toLowerCase().includes(query) ||
      (s.keywords || "").toLowerCase().includes(query) ||
      s.penIds.some(pid => pid.toLowerCase().includes(query))
    ))
    .sort((a, b) => (a.sortOrder || 99) - (b.sortOrder || 99));
}
