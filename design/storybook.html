  }

  if (!html) {
    html = `<div style="padding:24px 10px;font-size:13px;color:var(--text-muted);">无匹配组件</div>`;
  }

  navEl.innerHTML = html;
  navEl.querySelectorAll("[data-nav-group]").forEach(btn => {
    btn.addEventListener("click", () => {
      const code = btn.dataset.navGroup;
      const sec = btn.closest(".sb-nav-section");
      const nextOpen = !AppState.openNavGroups.has(code);
      if (nextOpen) AppState.openNavGroups.add(code);
      else AppState.openNavGroups.delete(code);
      if (sec) sec.dataset.open = String(nextOpen);
      btn.setAttribute("aria-expanded", String(nextOpen));
    });
  });
  navEl.querySelectorAll("[data-nav-story]").forEach(btn => {
    btn.addEventListener("click", () => navigateToStory(btn.dataset.navStory, true, false));
  });

  if (scrollActive) {
    const activeRow = navEl.querySelector('.sb-nav-row[data-active="true"]');
    if (activeRow) activeRow.scrollIntoView({ block: "nearest" });
  }
}

function renderOverview(viewport) {
  document.documentElement.dataset.page = "overview";
  document.documentElement.dataset.stageMode = "default";
  document.documentElement.dataset.noBlueprint = "false";
  document.getElementById("sb-header-zh").textContent = "全部组件";
  document.getElementById("sb-header-en").textContent = "Overview";
  document.getElementById("sb-view-seg").style.display = "none";
  renderSpecPanel(null);

  viewport.innerHTML = `
    <div class="sb-overview-wrap">
      ${CATEGORIES.map(cat => {
        const list = getCategoryStories(cat.code);
        return `
          <section class="sb-ov-group">
            <div class="sb-ov-group-head">
              <span class="sb-ov-group-zh">${escapeHtml(cat.zh)}</span>
              <span class="sb-ov-group-en">${escapeHtml(cat.en)}</span>
            </div>
            <div class="sb-overview-grid">
              ${list.map(s => {
                const rawThumb = s.thumb || s.states?.[0]?.html || "";
                const safeThumb = rawThumb
                  .replace(/<button\b/gi, "<span")
                  .replace(/<\/button>/gi, "</span>")
                  .replace(/<a\b/gi, "<span")
                  .replace(/<\/a>/gi, "</span>");
                return `
                  <div role="button" tabindex="0" class="sb-overview-card" data-open-story="${s.id}">
                    <div class="sb-ov-thumb">${safeThumb}</div>
                    <div class="sb-ov-foot">
                      <span class="sb-ov-zh cjk">${escapeHtml(s.zh)}</span>
                      <span class="sb-ov-en">${escapeHtml(s.en)}</span>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </section>
        `;
      }).join("")}
    </div>
  `;

  viewport.querySelectorAll("[data-open-story]").forEach(card => {
    card.addEventListener("click", () => navigateToStory(card.dataset.openStory));
    card.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        navigateToStory(card.dataset.openStory);
      }
    });
  });

  bindStageMeasurement(viewport);
}

function configureStageNaturalWidth(story, stageEl, planeEl) {
  const needsFullWidth = stageEl.classList.contains("stretch") ||
    (stageEl.firstElementChild && stageEl.firstElementChild.style && stageEl.firstElementChild.style.width === "100%");
  if (needsFullWidth) {
    let natW = getStoryMasterWidth(story);
    if (!natW) {
      const mw = stageEl.firstElementChild?.style?.maxWidth;
      const m = mw && mw.match(/^(\d+)px$/);
      natW = m ? Number(m[1]) : 816;
    }
    stageEl.style.width = `${natW}px`;
    planeEl.style.width = `${natW}px`;
  } else {
    stageEl.style.width = "max-content";
    planeEl.style.width = "max-content";
  }
}

function renderSingleStory(story, viewport, preserveManualZoom = false) {
  const isMotion = isMotionStory(story.id);
  const isVisual = isVisualStory(story.id);
  const isDocument = isDocumentStory(story.id);
  const visualFull = isVisual &&
    (AppState.viewTab === "live" || (AppState.viewTab === "hosts" && (AppState.hostSubTab === "gpui" || AppState.hostSubTab === "web")));
  const documentFull = isDocument && AppState.viewTab === "live";

  document.documentElement.dataset.page = "story";
  document.documentElement.dataset.storyId = story.id;
  document.documentElement.dataset.noBlueprint = String(isVisual || isMotion || isDocument);
  document.documentElement.dataset.stageMode = isMotion ? "motion" : visualFull ? "visual-fill" : documentFull ? "document" : "default";

  // 按当前切面同步网格与标尺默认态（展示默认开启；状态与多端默认关闭）
  syncCanvasPrefsForCurrentView();

  document.getElementById("sb-header-zh").textContent = story.zh;
  document.getElementById("sb-header-en").textContent = story.en;

  const segEl = document.getElementById("sb-view-seg");
  if (isMotion) {
    segEl.style.display = "none";
  } else {
    segEl.style.display = "grid";
    requestAnimationFrame(() => updateSegPill(segEl));
  }

  renderSpecPanel(isDocument ? null : story);

  const controlsSlot = document.getElementById("story-controls-slot");
  controlsSlot.innerHTML = "";

  // 动效曲线展示台：与其他组件一致，上方视觉舞台 + 左下控制槽 + 底部规格面板
  if (isMotion) {
    viewport.innerHTML = "";
    story.mount(viewport, controlsSlot);
    drawPixelGrid();
    return;
  }

  // 文档排版展示台（markdown-prose）：当前主题实底、无网格与标尺、1:1 纵向滚动
  if (documentFull) {
    viewport.innerHTML = "";
    story.mount(viewport, controlsSlot);
    drawPixelGrid();
    return;
  }

  // 材质与着色器（glass-surfaces / blue-hour-shaders）统一采用全幅展示区：无网格、无标尺、无缩放条
  if (visualFull) {
    viewport.innerHTML = "";
    if (AppState.viewTab === "live") {
      story.mount(viewport, controlsSlot);
    } else {
      const hostInfo = AppState.hostSubTab === "gpui" ? story.hosts.gpui : story.hosts.web;
      const hostName = AppState.hostSubTab === "gpui" ? "桌面端 GPUI · Rust" : "网页端 React · Web";
      const tempHostCtrls = document.createElement("div");
      story.mount(viewport, tempHostCtrls);
      const hostSegHtml = `
        <div class="seg-track seg-wide" data-host-subseg="true" style="width:288px;height:28px;padding:2px;">
          <span class="seg-pill" style="top:2px;height:22px;"></span>
          <button type="button" class="seg-item" style="height:22px;font-size:12px;" data-hs="all" data-active="false">双端同屏</button>
          <button type="button" class="seg-item" style="height:22px;font-size:12px;" data-hs="gpui" data-active="${AppState.hostSubTab === "gpui"}">${icon("monitor", 12)}<span>桌面端</span></button>
          <button type="button" class="seg-item" style="height:22px;font-size:12px;" data-hs="web" data-active="${AppState.hostSubTab === "web"}">${icon("globe", 12)}<span>网页端</span></button>
        </div>
      `;
      controlsSlot.innerHTML = `
        ${hostSegHtml}
        <span style="font-size:12px;color:var(--text-secondary);"><b style="color:var(--text-primary);margin-right:6px;">${hostName}</b>${escapeHtml(hostInfo.note)}</span>
      `;
      const subSeg = controlsSlot.querySelector("[data-host-subseg]");
      if (subSeg) {
        requestAnimationFrame(() => updateSegPill(subSeg));
        subSeg.querySelectorAll("[data-hs]").forEach(btn => {
          btn.addEventListener("click", () => {
            AppState.hostSubTab = btn.dataset.hs;
            renderCurrent(false);
          });
        });
      }
    }
    drawPixelGrid();
    return;
  }

  viewport.innerHTML = `
    <div class="sb-zoom-scroll-canvas">
      <div class="sb-zoom-sizer" id="sb-zoom-sizer">
        <div class="sb-zoom-plane" id="sb-zoom-plane"></div>
      </div>
    </div>
  `;
  const plane = viewport.querySelector("#sb-zoom-plane");

  if (AppState.viewTab === "live") {
    plane.innerHTML = `<div class="sb-stage-mount" id="story-stage-slot"></div>`;
    const stageSlot = plane.querySelector("#story-stage-slot");
    story.mount(stageSlot, controlsSlot);
    configureStageNaturalWidth(story, stageSlot, plane);
  } else if (AppState.viewTab === "states") {
    plane.style.width = "max-content";
    plane.innerHTML = `
      <div class="sb-states-view">
        <div class="sb-state-grid">
          ${(story.states || []).map(st => `
            <div class="sb-state-cell">
              <div class="sb-state-preview">${st.html}</div>
              <div class="sb-state-caption">${escapeHtml(st.name)} · <span class="mono">${escapeHtml(st.sub)}</span></div>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  } else if (AppState.viewTab === "hosts") {
    if (!["all", "gpui", "web"].includes(AppState.hostSubTab)) AppState.hostSubTab = "all";
    const gpuiHtml = isPlainTextBadge(story.hosts.gpui.html) ? getStoryVisualFallback(story) : story.hosts.gpui.html;
    const webHtml = isPlainTextBadge(story.hosts.web.html) ? getStoryVisualFallback(story) : story.hosts.web.html;

    const hostSegHtml = `
      <div class="seg-track seg-wide" data-host-subseg="true" style="width:288px;height:28px;padding:2px;">
        <span class="seg-pill" style="top:2px;height:22px;"></span>
        <button type="button" class="seg-item" style="height:22px;font-size:12px;" data-hs="all" data-active="${AppState.hostSubTab === "all"}">双端同屏</button>
        <button type="button" class="seg-item" style="height:22px;font-size:12px;" data-hs="gpui" data-active="${AppState.hostSubTab === "gpui"}">${icon("monitor", 12)}<span>桌面端</span></button>
        <button type="button" class="seg-item" style="height:22px;font-size:12px;" data-hs="web" data-active="${AppState.hostSubTab === "web"}">${icon("globe", 12)}<span>网页端</span></button>
      </div>
    `;

    if (AppState.hostSubTab === "gpui" || AppState.hostSubTab === "web") {
      const hostInfo = AppState.hostSubTab === "gpui" ? story.hosts.gpui : story.hosts.web;
      const hostName = AppState.hostSubTab === "gpui" ? "桌面端 GPUI · Rust" : "网页端 React · Web";
      plane.innerHTML = `<div class="sb-stage-mount" id="host-live-stage"></div>`;
      const stageSlot = plane.querySelector("#host-live-stage");
      const tempHostCtrls = document.createElement("div");
      story.mount(stageSlot, tempHostCtrls);
      configureStageNaturalWidth(story, stageSlot, plane);

      controlsSlot.innerHTML = `
        ${hostSegHtml}
        <span style="font-size:12px;color:var(--text-secondary);"><b style="color:var(--text-primary);margin-right:6px;">${hostName}</b>${escapeHtml(hostInfo.note)}</span>
      `;
    } else {
      plane.style.width = "max-content";
      plane.innerHTML = `
        <div class="sb-hosts-view">
          <div class="sb-host-row">
            <div class="sb-host-meta">
              <span class="sb-host-title">${icon("monitor", 15)}<span>桌面端</span></span>
              <span class="sb-host-sub">GPUI · Rust</span>
            </div>
            <div class="sb-host-body">
              <div class="sb-host-specimen">${gpuiHtml}</div>
              <div class="sb-host-brief">${escapeHtml(story.hosts.gpui.note)}</div>
            </div>
          </div>
          <div class="sb-host-row">
            <div class="sb-host-meta">
              <span class="sb-host-title">${icon("globe", 15)}<span>网页端</span></span>
              <span class="sb-host-sub">React · Web</span>
            </div>
            <div class="sb-host-body">
              <div class="sb-host-specimen">${webHtml}</div>
              <div class="sb-host-brief">${escapeHtml(story.hosts.web.note)}</div>
            </div>
          </div>
        </div>
      `;
      controlsSlot.innerHTML = hostSegHtml;
    }

    const subSeg = controlsSlot.querySelector("[data-host-subseg]");
    if (subSeg) {
      requestAnimationFrame(() => updateSegPill(subSeg));
      subSeg.querySelectorAll("[data-hs]").forEach(btn => {
        btn.addEventListener("click", () => {
          AppState.hostSubTab = btn.dataset.hs;
          renderCurrent(false);
        });
      });
    }
  }

  // 计算并应用组件自动适配缩放比例（展示 / 状态 / 多端 共享同一套规则）
  plane.style.transform = "scale(1)";
  const autoScale = computeAutoZoom(viewport);
  AppState.autoZoomValue = autoScale;
  if (!preserveManualZoom || AppState.zoomAuto) {
    applyZoom(autoScale, true);
  } else {
    applyZoom(AppState.zoom, false);
  }

  bindStageMeasurement(viewport);
}

function renderCurrent(preserveManualZoom = false) {
  clearStoryRuntime();
  AppState.compX = 0;
  AppState.compY = 0;
  AppState.panX = 0;
  AppState.panY = 0;
  activeSnapState = { x: null, y: null, labelX: "", labelY: "" };
  updateDragBadge(false);
  updateResetPosButtonUI();
  const viewport = document.getElementById("sb-viewport");
  if (viewport) {
    viewport.scrollTop = 0;
    viewport.scrollLeft = 0;
  }
  if (AppState.activeStoryId === "overview") {
    renderOverview(viewport);
  } else if (AppState.activeStoryId === "tokens") {
    renderTokensPage(viewport);
  } else {
    const story = STORIES.find(s => s.id === AppState.activeStoryId) || STORIES[0];
    renderSingleStory(story, viewport, preserveManualZoom);
  }
}

function navigateToStory(storyId, updateHash = true, scrollNav = true) {
  const valid = storyId === "overview" || storyId === "tokens" || STORIES.some(s => s.id === storyId);
  AppState.activeStoryId = valid ? storyId : "overview";
  AppState.zoomAuto = true;
  const targetStory = STORIES.find(s => s.id === AppState.activeStoryId);
  if (targetStory && targetStory.category) {
    AppState.openNavGroups.add(targetStory.category);
  }

  if (updateHash) {
    const targetHash = AppState.activeStoryId === "overview"
      ? "#/overview"
      : AppState.activeStoryId === "tokens"
        ? "#/tokens"
        : `#/story/${AppState.activeStoryId}`;
    if (window.location.hash !== targetHash) {
      history.replaceState(null, "", targetHash);
    }
  }

  renderSidebarNav(scrollNav);
  renderCurrent(false);
}

/* ============================================================================
   7. Ctrl+K 0ms 跳转面板与顶栏/主题/画布工具/设置菜单/契约拖拽初始化
   ============================================================================ */
let cmdkOpen = false;
let cmdkFocusIdx = 0;
let closeAllShellMenus = () => {};

function openCmdk(triggerEl = document.activeElement) {
  const scrim = document.getElementById("cmdk-scrim");
  const inp = document.getElementById("cmdk-input");
  const listEl = document.getElementById("cmdk-list");
  if (!scrim) return;
  closeAllShellMenus();
  const closeCmdk = (restore = true) => {
    cmdkOpen = false;
    scrim.dataset.open = "false";
    scrim.setAttribute("aria-hidden", "true");
    popSurfaceById("cmdk", restore);
  };
  cmdkOpen = true;
  scrim.dataset.open = "true";
  scrim.setAttribute("aria-hidden", "false");
  inp.value = "";
  cmdkFocusIdx = 0;
  renderCmdkItems(false);
  if (listEl) listEl.scrollTop = 0;
  pushSurface("cmdk", "快捷跳转 Ctrl+K", triggerEl, closeCmdk);
  requestAnimationFrame(() => inp.focus());
}

function getCmdkCandidates() {
  const q = (document.getElementById("cmdk-input")?.value || "").trim().toLowerCase();
  const all = [
    { id: "overview", zh: "全部组件", en: "Overview", penLabel: `${STORIES.length} 项`, penIds: [] },
    { id: "tokens", zh: "设计令牌", en: "Design Tokens", penLabel: "变量与色值", keywords: "变量 颜色 语义令牌", penIds: [] },
    ...STORIES
  ];
  return all.filter(it =>
    !q ||
    it.en.toLowerCase().includes(q) ||
    it.zh.toLowerCase().includes(q) ||
    it.id.toLowerCase().includes(q) ||
    (it.keywords || "").toLowerCase().includes(q) ||
    it.penIds.some(p => p.toLowerCase().includes(q))
  );
}

function syncCmdkFocusHighlight(scrollIntoView = false) {
  const listEl = document.getElementById("cmdk-list");
  if (!listEl) return;
  const rows = listEl.querySelectorAll(".cmdk-row");
  rows.forEach((row, idx) => {
    const focused = idx === cmdkFocusIdx;
    row.dataset.focused = String(focused);
    if (focused && scrollIntoView) {
      row.scrollIntoView({ block: "nearest" });
    }
  });
}

function renderCmdkItems(scrollFocused = false) {
  const listEl = document.getElementById("cmdk-list");
  const countEl = document.getElementById("cmdk-count");
  const items = getCmdkCandidates();
  if (cmdkFocusIdx >= items.length) cmdkFocusIdx = 0;
  if (countEl) countEl.textContent = `${items.length} 项`;

  listEl.innerHTML = items.length ? items.map((it, i) => `
    <button type="button" class="cmdk-row" data-cmdk-pick="${it.id}" data-cmdk-idx="${i}" data-focused="${i === cmdkFocusIdx}">
      <span class="cmdk-row-main">
        <span class="cmdk-row-en">${escapeHtml(it.en)}</span>
        <span class="cmdk-row-zh cjk">${escapeHtml(it.zh)}</span>
      </span>
      <span class="cmdk-row-meta">${escapeHtml(it.penLabel || (it.kind === "motion" ? "动效曲线" : it.penIds.join(" · ")))}</span>
    </button>
  `).join("") : `<div style="padding:28px 16px;font-size:13px;color:var(--text-muted);text-align:center;">无匹配组件</div>`;

  listEl.querySelectorAll("[data-cmdk-pick]").forEach(btn => {
    btn.addEventListener("mouseenter", () => {
      const idx = Number(btn.dataset.cmdkIdx);
      if (!Number.isNaN(idx) && idx !== cmdkFocusIdx) {
        cmdkFocusIdx = idx;
        syncCmdkFocusHighlight(false);
      }
    });
    btn.addEventListener("click", () => {
      const target = btn.dataset.cmdkPick;
      popTopSurface();
      navigateToStory(target, true, true);
    });
  });

  if (scrollFocused) {
    syncCmdkFocusHighlight(true);
  }
}

function applyTheme(nextTheme) {
  AppState.theme = nextTheme === "dark" ? "dark" : "light";
  document.documentElement.dataset.theme = AppState.theme;
  try { localStorage.setItem("cst-storybook-theme", AppState.theme); } catch {}

  const themeSeg = document.getElementById("sb-theme-seg");
  if (themeSeg) {
    themeSeg.querySelectorAll("[data-theme-pick]").forEach(b => {
      b.dataset.active = String(b.dataset.themePick === AppState.theme);
    });
    requestAnimationFrame(() => updateSegPill(themeSeg));
  }
  const setThemeSeg = document.getElementById("sb-set-theme-seg");
  if (setThemeSeg) {
    setThemeSeg.querySelectorAll("[data-set-theme]").forEach(b => {
      b.dataset.active = String(b.dataset.setTheme === AppState.theme);
    });
  }

  if (isNonStoryPage() || AppState.activeStoryId === "glass-surfaces" || AppState.activeStoryId === "blue-hour-shaders") {
    const vp = document.getElementById("sb-viewport");
    const prevScroll = vp ? vp.scrollTop : 0;
    renderCurrent(false);
    if (vp) vp.scrollTop = prevScroll;
  } else {
    scheduleBlueprintMeasure(80);
  }
}

function applyGridVisible(nextShow, silent = false, persist = true) {
  AppState.showGrid = Boolean(nextShow);
  document.documentElement.dataset.grid = AppState.showGrid ? "on" : "off";
  if (persist && !isBlueprintSuppressed()) {
    AppState.canvasPrefs[getCanvasPrefsBucket()].showGrid = AppState.showGrid;
    saveCanvasPrefs();
  }

  const hudBtn = document.getElementById("sb-grid-btn");
  if (hudBtn) {
    hudBtn.dataset.active = String(AppState.showGrid);
    hudBtn.setAttribute("aria-pressed", String(AppState.showGrid));
  }
  const setBtn = document.getElementById("sb-set-grid-btn");
  if (setBtn) {
    setBtn.dataset.checked = String(AppState.showGrid);
  }

  drawPixelGrid();
  if (!silent) {
    showToast({ text: AppState.showGrid ? "1px 背景网格已开启" : "背景网格已关闭" });
  }
}

function syncSnapControlsUI() {
  const btn = document.getElementById("sb-snap-btn");
  const lbl = document.getElementById("sb-snap-btn-label");
  const tog = document.getElementById("sb-snap-toggle-btn");
  const setTog = document.getElementById("sb-set-snap-btn");
  if (btn) btn.dataset.mode = AppState.snapEnabled ? "on" : "off";
  if (lbl) lbl.textContent = AppState.snapEnabled ? `吸附 · ${AppState.snapStep}px` : "吸附 · 关";
  if (tog) tog.dataset.checked = String(AppState.snapEnabled);
  if (setTog) setTog.dataset.checked = String(AppState.snapEnabled);

  const hudSeg = document.getElementById("sb-snap-step-seg");
  if (hudSeg) {
    hudSeg.querySelectorAll("[data-snap-step]").forEach(b => {
      b.dataset.active = String(Number(b.dataset.snapStep) === AppState.snapStep);
    });
  }
  const setSeg = document.getElementById("sb-set-snap-step-seg");
  if (setSeg) {
    setSeg.querySelectorAll("[data-set-snap-step]").forEach(b => {
      b.dataset.active = String(Number(b.dataset.setSnapStep) === AppState.snapStep);
    });
  }
}

function applySnapEnabled(nextOn, silent = false) {
  AppState.snapEnabled = Boolean(nextOn);
  try { localStorage.setItem("cst-storybook-snap", AppState.snapEnabled ? "on" : "off"); } catch {}
  syncSnapControlsUI();
  if (!silent) {
    showToast({ text: AppState.snapEnabled ? `拖拽吸附已开启 (${AppState.snapStep}px)` : "拖拽吸附已关闭（保留 1px 整数像素）" });
  }
}

function applySnapStep(nextStep, silent = false) {
  const parsed = [1, 4, 8, 10].includes(Number(nextStep)) ? Number(nextStep) : 1;
  AppState.snapStep = parsed;
  try { localStorage.setItem("cst-storybook-snap-step", String(parsed)); } catch {}
  syncSnapControlsUI();
  drawPixelGrid();
  if (!silent) {
    showToast({ text: `网格吸附步进：${parsed}px` });
  }
}

function applyRulerMode(nextMode, silent = false, persist = true) {
  const valid = ["off", "dim", "normal"].includes(nextMode) ? nextMode : "off";
  AppState.rulerMode = valid;
  document.documentElement.dataset.rulerMode = valid;
  if (persist && !isBlueprintSuppressed()) {
    AppState.canvasPrefs[getCanvasPrefsBucket()].rulerMode = valid;
    saveCanvasPrefs();
  }

  const shortMap = { off: "标尺 · 关", dim: "标尺 · 低透明", normal: "标尺 · 常亮" };
  const btn = document.getElementById("sb-ruler-btn");
  const lbl = document.getElementById("sb-ruler-btn-label");
  if (btn) btn.dataset.mode = valid;
  if (lbl) lbl.textContent = shortMap[valid];

  const menu = document.getElementById("sb-ruler-menu");
  if (menu) {
    menu.querySelectorAll("[data-ruler-pick]").forEach(item => {
      item.dataset.checked = String(item.dataset.rulerPick === valid);
    });
  }
  const setRulerSeg = document.getElementById("sb-set-ruler-seg");
  if (setRulerSeg) {
    setRulerSeg.querySelectorAll("[data-set-ruler]").forEach(item => {
      item.dataset.active = String(item.dataset.setRuler === valid);
    });
  }

  scheduleBlueprintMeasure(60);
  if (!silent) {
    const toastMap = { off: "像素标尺与参考线已关闭", dim: "标尺：低透明（悬停高亮）", normal: "标尺：常亮显示" };
    showToast({ text: toastMap[valid] });
  }
}

  // 左下角设置浮层内部绑定（与顶栏、画布 HUD 双向同步）

  const slowBtn = document.getElementById("sb-slow-btn");

  function toggleSlowMotion() {

  function toggleReducedMotion() {

    syncDebugStatesUI();
    (AppState.activeRunningLights || []).forEach(r => r.refreshMotion());
    if (AppState.activeShaderController) AppState.activeShaderController.redraw();
    showToast({ text: AppState.reducedMotion ? "减少动态已开启 (0ms)" : "常规动态已恢复", ignoreSlow: true });

  function toggleImeComposing() {

  slowBtn.addEventListener("click", toggleSlowMotion);

  // 画布缩放拖动条 (对数映射 50%–1600%) + 点击百分比恢复自动比例 + Ctrl/Alt+滚轮切档
  const zoomSlider = document.getElementById("sb-zoom-slider");

  document.getElementById("sb-zoom-readout").addEventListener("click", () => {

  });

  const rulerStage = document.getElementById("sb-ruler-stage");
  let wheelAccum = 0;
  let wheelLastTs = 0;
  rulerStage.addEventListener("wheel", (e) => {
    if ((!e.altKey && !e.ctrlKey && !e.metaKey) || isNonStoryPage() || isVisualFullMode()) return;
    e.preventDefault();
    const now = performance.now();
    if (now - wheelLastTs > 180 || (wheelAccum !== 0 && Math.sign(wheelAccum) !== Math.sign(e.deltaY))) {
      wheelAccum = 0;
    }
    wheelLastTs = now;
    wheelAccum += e.deltaY;
    if (Math.abs(wheelAccum) >= 30) {
      stepZoomPreset(wheelAccum < 0 ? 1 : -1);
      wheelAccum = 0;
    }
  }, { passive: false });

  // ==========================================================================
  // 画布拖拽平移 (空网格/中键/Space) + 组件拖拽与 1px/网格吸附系统
  // ==========================================================================
  const viewport = document.getElementById("sb-viewport");
  let spacePanHeld = false;
  let dragCtx = null; // { mode: "pan" | "comp", pointerId, startX, startY, origPanX, origPanY, origCompX, origCompY, activated }
  let suppressNextClickUntil = 0;

  document.addEventListener("click", (e) => {
    if (performance.now() < suppressNextClickUntil) {
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);

  function isEditableTarget(el) {
    if (!el || !(el instanceof Element)) return false;
    return Boolean(el.closest("input, textarea, select, [contenteditable='true']"));
  }

  viewport.addEventListener("pointerdown", (e) => {
    if (isBlueprintSuppressed()) return;
    if (e.button !== 0 && e.button !== 1) return;
    if (e.target.closest(".sb-stage-hud-bar, .sb-floating-controls, .sb-canvas-hud")) return;

    const plane = viewport.querySelector("#sb-zoom-plane");
    const clickedInsidePlane = plane && plane.contains(e.target);
    const wantPan = e.button === 1 || spacePanHeld || !clickedInsidePlane;

    if (!wantPan && isEditableTarget(e.target)) return;

    dragCtx = {
      mode: wantPan ? "pan" : "comp",
      pointerId: e.pointerId,
      startX: e.clientX,
      startY: e.clientY,
      origPanX: AppState.panX,
      origPanY: AppState.panY,
      origCompX: AppState.compX,
      origCompY: AppState.compY,
      activated: wantPan
    };

    if (wantPan) {
      isPanningCanvas = true;
      rulerStage.classList.add("is-panning");
      e.preventDefault();
      try { viewport.setPointerCapture(e.pointerId); } catch {}
    }
  });

  window.addEventListener("pointermove", (e) => {
    if (!dragCtx || e.pointerId !== dragCtx.pointerId) return;
    const dx = e.clientX - dragCtx.startX;
    const dy = e.clientY - dragCtx.startY;

    if (dragCtx.mode === "pan") {
      AppState.panX = dragCtx.origPanX + dx;
      AppState.panY = dragCtx.origPanY + dy;
      syncZoomPlaneLayout();
      renderBlueprintOverlay();
      return;
    }

    if (!dragCtx.activated) {
      if (Math.hypot(dx, dy) < 5) return;
      dragCtx.activated = true;
      isDraggingComponent = true;
      rulerStage.classList.add("is-dragging-comp");
      try { viewport.setPointerCapture(dragCtx.pointerId); } catch {}
    }

    const z = AppState.zoom || 1;
    const rawX = dragCtx.origCompX + dx / z;
    const rawY = dragCtx.origCompY + dy / z;
    const snapped = computeComponentSnap(rawX, rawY, e.altKey);
    AppState.compX = snapped.x;
    AppState.compY = snapped.y;
    activeSnapState = { x: snapped.snapX, y: snapped.snapY, labelX: snapped.label, labelY: snapped.label };
    syncZoomPlaneLayout();
    renderBlueprintOverlay();
    updateDragBadge(true, snapped.label);
  });

  function finishCanvasDrag(e) {
    if (!dragCtx || (e && e.pointerId !== dragCtx.pointerId)) return;
    const wasActiveComp = dragCtx.mode === "comp" && dragCtx.activated;
    try { viewport.releasePointerCapture(dragCtx.pointerId); } catch {}
    dragCtx = null;
    isPanningCanvas = false;
    isDraggingComponent = false;
    activeSnapState = { x: null, y: null, labelX: "", labelY: "" };
    rulerStage.classList.remove("is-panning", "is-dragging-comp");
    updateDragBadge(false);
    if (wasActiveComp) {
      suppressNextClickUntil = performance.now() + 260;
    }
    scheduleBlueprintMeasure(40);
  }
  window.addEventListener("pointerup", finishCanvasDrag);
  window.addEventListener("pointercancel", finishCanvasDrag);

  // 底部说明面板拖拽调节高度
  const specResizer = document.getElementById("sb-spec-resizer");
  const specPanel = document.getElementById("sb-spec-panel");
  const mainEl = document.getElementById("sb-workspace");
  let draggingSpec = false;
  let dragStartY = 0;
  let dragStartH = 228;

  specResizer.addEventListener("pointerdown", (e) => {
    draggingSpec = true;
    dragStartY = e.clientY;
    dragStartH = specPanel.getBoundingClientRect().height;
    specResizer.classList.add("is-dragging");
    specResizer.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  specResizer.addEventListener("pointermove", (e) => {
    if (!draggingSpec) return;
    const maxH = Math.max(200, Math.round((mainEl.clientHeight || 720) * 0.62));
    const nextH = Math.max(128, Math.min(maxH, Math.round(dragStartH - (e.clientY - dragStartY))));
    AppState.specPanelHeight = nextH;
    specPanel.style.height = `${nextH}px`;
    scheduleBlueprintMeasure(0);
  });
  const endSpecDrag = (e) => {
    if (!draggingSpec) return;
    draggingSpec = false;
    specResizer.classList.remove("is-dragging");
    try { specResizer.releasePointerCapture(e.pointerId); } catch {}
    scheduleBlueprintMeasure(60);
  };
  specResizer.addEventListener("pointerup", endSpecDrag);
  specResizer.addEventListener("pointercancel", endSpecDrag);
  specResizer.addEventListener("dblclick", () => {
    AppState.specPanelHeight = 264;
    specPanel.style.height = "264px";
    scheduleBlueprintMeasure(60);
  });

  // 视口滚动、组件悬停高亮参考线与标尺同步
  viewport.addEventListener("scroll", () => scheduleBlueprintMeasure(0), { passive: true });
  viewport.addEventListener("pointermove", (e) => {
    const r = viewport.getBoundingClientRect();
    pointerInVp = { x: e.clientX - r.left, y: e.clientY - r.top };
    updateHoverHighlightState();
  }, { passive: true });
  viewport.addEventListener("pointerleave", () => {
    pointerInVp = null;
    updateHoverHighlightState();
  });

  ["sb-ruler-top", "sb-ruler-left", "sb-ruler-corner"].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("pointerenter", () => {
      hoveringRuler = true;
      updateHoverHighlightState();
    });
    el.addEventListener("pointerleave", () => {
      hoveringRuler = false;
      updateHoverHighlightState();
    });
  });

  window.addEventListener("resize", () => {
    updateSegPill(viewSeg);
    updateSegPill(themeSeg);
    if (AppState.zoomAuto && !isNonStoryPage()) {
      const autoScale = computeAutoZoom(viewport);
      AppState.autoZoomValue = autoScale;
      applyZoom(autoScale, true);
    } else {
      scheduleBlueprintMeasure(120);
    }
  });

  // 弹窗绑定
  document.getElementById("modal-cancel-btn").addEventListener("click", () => activeModalCallbacks?.closeModal(true));
  document.getElementById("modal-confirm-btn").addEventListener("click", () => {
    const cb = activeModalCallbacks?.onConfirm;
    activeModalCallbacks?.closeModal(true);
    if (cb) cb();
  });
  document.getElementById("modal-scrim").addEventListener("click", (e) => {
    if (e.target.id === "modal-scrim") activeModalCallbacks?.closeModal(true);
  });

  // Ctrl+K
  cmdkBtn.addEventListener("click", (e) => openCmdk(e.currentTarget));
  document.getElementById("cmdk-scrim").addEventListener("click", (e) => {
    if (e.target.id === "cmdk-scrim") popTopSurface();
  });
  const cmdkInp = document.getElementById("cmdk-input");
  cmdkInp.addEventListener("input", () => {
    cmdkFocusIdx = 0;
    renderCmdkItems(false);
    const listEl = document.getElementById("cmdk-list");
    if (listEl) listEl.scrollTop = 0;
  });
  cmdkInp.addEventListener("keydown", (e) => {
    if (AppState.imeComposing) return;
    const items = getCmdkCandidates();
    if (e.key === "ArrowDown") {
      e.preventDefault();
      cmdkFocusIdx = items.length ? (cmdkFocusIdx + 1) % items.length : 0;
      syncCmdkFocusHighlight(true);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      cmdkFocusIdx = items.length ? (cmdkFocusIdx - 1 + items.length) % items.length : 0;
      syncCmdkFocusHighlight(true);
    } else if (e.key === "Enter" && items[cmdkFocusIdx]) {
      e.preventDefault();
      const id = items[cmdkFocusIdx].id;
      popTopSurface();
      navigateToStory(id, true, true);
    }
  });

  document.addEventListener("keydown", (e) => {
    const activeTag = document.activeElement?.tagName;
    const inTextField = ["INPUT", "TEXTAREA", "SELECT"].includes(activeTag) || document.activeElement?.isContentEditable;

    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      if (cmdkOpen) popTopSurface();
      else openCmdk(document.activeElement);
      return;
    }
    if (e.key === "/" && !inTextField) {
      e.preventDefault();
      if (AppState.sidebarCollapsed) setSidebarCollapsed(false);
      searchInp.focus();
      return;
    }
    if (e.code === "Space" && !inTextField && !isBlueprintSuppressed() && AppState.focusStack.length <= 1 && activeTag !== "BUTTON") {
      if (!spacePanHeld) {
        spacePanHeld = true;
        rulerStage.dataset.spacePan = "true";
      }
      e.preventDefault();
      return;
    }
    // 1px 键盘方向键微调 (Shift + 方向键 = 10px)，仅在无控件聚焦且无浮层时生效
    if (!isBlueprintSuppressed() && AppState.focusStack.length <= 1 && (document.activeElement === document.body || document.activeElement === viewport) && ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
      e.preventDefault();
      const step = e.shiftKey ? 10 : 1;
      if (e.key === "ArrowLeft") AppState.compX -= step;
      if (e.key === "ArrowRight") AppState.compX += step;
      if (e.key === "ArrowUp") AppState.compY -= step;
      if (e.key === "ArrowDown") AppState.compY += step;
      syncZoomPlaneLayout();
      renderBlueprintOverlay();
      return;
    }
    if (e.key === "Escape") {
      if (AppState.imeComposing && ["INPUT", "TEXTAREA"].includes(activeTag)) {
        logAction("IME 拦截", "组合态内按 Esc 仅清拼音");
        return;
      }
      if (settingsMenu.dataset.open === "true") { setSettingsMenuOpen(false); e.preventDefault(); return; }
      if (debugMenu.dataset.open === "true") { setDebugMenuOpen(false); e.preventDefault(); return; }
      if (snapMenu.dataset.open === "true") { setSnapMenuOpen(false); e.preventDefault(); return; }
      if (rulerMenu.dataset.open === "true") { setRulerMenuOpen(false); e.preventDefault(); return; }
      if (popTopSurface()) {
        e.preventDefault();
        e.stopPropagation();
      }
    }
  });

  document.addEventListener("keyup", (e) => {
    if (e.code === "Space" && spacePanHeld) {
      spacePanHeld = false;
      rulerStage.dataset.spacePan = "false";
    }
  });
  window.addEventListener("blur", () => {
    if (spacePanHeld) {
      spacePanHeld = false;
      rulerStage.dataset.spacePan = "false";
    }
    finishCanvasDrag();
  });

  let savedTheme = "light";
  try {
    const st = localStorage.getItem("cst-storybook-theme");
    if (st === "dark" || st === "light") savedTheme = st;
  } catch {}
  applyTheme(savedTheme);

  try {
    const raw = localStorage.getItem("cst-storybook-prefs-v3");
    if (raw) {
      const parsed = JSON.parse(raw);
      for (const k of ["showcase", "compare"]) {
        if (parsed?.[k]) {
          if (typeof parsed[k].showGrid === "boolean") AppState.canvasPrefs[k].showGrid = parsed[k].showGrid;
          if (["off", "dim", "normal"].includes(parsed[k].rulerMode)) AppState.canvasPrefs[k].rulerMode = parsed[k].rulerMode;
        }
      }
    }
  } catch {}
  applyGridVisible(AppState.canvasPrefs.showcase.showGrid, true, false);
  applyRulerMode(AppState.canvasPrefs.showcase.rulerMode, true, false);

  let savedSnap = true;
  try {
    const ss = localStorage.getItem("cst-storybook-snap");
    if (ss === "off") savedSnap = false;
  } catch {}
  applySnapEnabled(savedSnap, true);

  let savedSnapStep = 1;
  try {
    const stp = Number(localStorage.getItem("cst-storybook-snap-step"));
    if ([1, 4, 8, 10].includes(stp)) savedSnapStep = stp;
  } catch {}
  applySnapStep(savedSnapStep, true);

  function routeFromHash() {
    const h = window.location.hash || "#/overview";
    if (h === "#/tokens") {
      navigateToStory("tokens", false, true);
      return;
    }
    const m = h.match(/^#\/story\/([a-z0-9-]+)$/i);
    navigateToStory(m ? m[1] : "overview", false, true);
  }
  window.addEventListener("hashchange", routeFromHash);

  routeFromHash();
}

initStorybookApp();
/* (@section:runtime:end) */

</script>
</body>
</html>
