name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: 运行完整验收（浏览器、字体与跨端测试）
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust 核心
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      PI_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: 准备 Rust 隔离环境
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'cst-rust'
          New-Item -ItemType Directory -Force "$root/agent" | Out-Null
          "CARGO_TARGET_DIR=$root/target" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PI_CODING_AGENT_DIR=$root/agent" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/cst-rust/target
          key: rust-${{ runner.os }}-1.99.1-${{ hashFiles('Cargo.lock') }}
      - name: 格式检查
        run: cargo fmt --all --check
      - name: Clippy 检查
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: 隔离回归测试
        run: cargo test --workspace --locked
      - name: 故障注入静态检查
        run: cargo clippy --workspace --all-targets --locked --features test-support -- -D warnings
      - name: 故障恢复回归测试
        run: cargo test --workspace --locked --features test-support

  agent:
    name: Agent 与发行包
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci --prefix agent --ignore-scripts
      - run: npm run check --prefix agent
      - name: 准备固定版本 PowerShell 静态检查
        shell: pwsh
        run: |
          $modules = Join-Path $env:RUNNER_TEMP "cst-check-modules"
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default -ErrorAction Stop
          }
          Save-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Repository PSGallery -Path $modules -Force -ErrorAction Stop
          "CST_PSSCRIPTANALYZER_MODULE=$modules/PSScriptAnalyzer/1.24.0/PSScriptAnalyzer.psd1" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: npm run check:engineering --prefix agent
      - run: npm run test:oauth --prefix agent
      - run: npm run test:telemetry --prefix agent
        env:
          CST_WEB_TEST_TMPDIR: ${{ runner.temp }}
      - run: npm run test:web --prefix agent
        if: inputs.full
        env:
          CST_WEB_TEST_TMPDIR: ${{ runner.temp }}
      - run: npm run test:web:shared-audit --prefix agent
        if: inputs.full
        env:
          CST_WEB_TEST_TMPDIR: ${{ runner.temp }}
      - name: 安装固定网页扩展以验证实际SSRF规则
        if: inputs.full
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force agent/home/npm | Out-Null
          Copy-Item pack/extensions.package.json agent/home/npm/package.json
          Copy-Item pack/extensions.package-lock.json agent/home/npm/package-lock.json
          npm ci --ignore-scripts --legacy-peer-deps --prefix agent/home/npm
      - name: 启动器与发行树回归
        if: ${{ !inputs.full }}
        run: node --test pack/test/launcher.test.mjs pack/test/release-checks.test.mjs
        env:
          CST_WEB_TEST_TMPDIR: ${{ runner.temp }}
      - run: node --test pack/test/*.test.mjs
        if: inputs.full
        env:
          CST_WEB_TEST_TMPDIR: ${{ runner.temp }}

  web:
    name: Web 前端
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            agent/package-lock.json
            src/web/frontend/package-lock.json
      # biome 由 agent 侧安装，前端的 lint 脚本直接调用它，保证格式规则只有一份。
      - run: npm ci --prefix agent --ignore-scripts
      - run: npm ci --prefix src/web/frontend --ignore-scripts
      - uses: actions/setup-python@v5
        if: inputs.full
        with:
          python-version: '3.11'
      - run: python -m pip install -r src/web/frontend/scripts/font-requirements.txt
        if: inputs.full
      - run: npm run lint --prefix src/web/frontend
      - run: npm run typecheck --prefix src/web/frontend
      - run: npm run test --prefix src/web/frontend
      - run: node --test src/test/*.test.mjs
        env:
          CST_WEB_TEST_TMPDIR: ${{ runner.temp }}
      - run: npm run build --prefix src/web/frontend
        if: inputs.full
      - run: npm run test:fonts --prefix src/web/frontend
        if: inputs.full
      - name: 浏览器与跨端用户链路 E2E
        if: inputs.full
        run: npm run test:web:e2e --prefix agent
        env:
          CST_WEB_TEST_TMPDIR: ${{ runner.temp }}
      - name: 保存 E2E 验证证据
        if: ${{ always() && inputs.full }}
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-evidence
          path: |
            ${{ runner.temp }}/**/browser-environment.json
            ${{ runner.temp }}/**/failure-state.json
            ${{ runner.temp }}/**/ui-regressions/*.png
            ${{ runner.temp }}/**/ui-regressions/report.json
            ${{ runner.temp }}/**/shared-configuration-e2e/*.png
            ${{ runner.temp }}/**/shared-configuration-e2e/report.json
            ${{ runner.temp }}/**/login-navigation/**/*.png
            ${{ runner.temp }}/**/login-navigation/report.json
            ${{ runner.temp }}/**/cwd-completion/*.png
            ${{ runner.temp }}/**/error-states/*.png
            ${{ runner.temp }}/**/first-turn-status/*.png
            ${{ runner.temp }}/**/first-turn-status/report.json
            ${{ runner.temp }}/**/first-turn-status/first-observation.json
            ${{ runner.temp }}/**/composer-tokens/*.png
            ${{ runner.temp }}/**/composer-tokens/*.json
            ${{ runner.temp }}/**/account-profile/*.png
            ${{ runner.temp }}/**/cstoa-key-login/*.png
            ${{ runner.temp }}/**/cstoa-login/*.png
            ${{ runner.temp }}/**/session-export/*.png
            ${{ runner.temp }}/**/special-tool-process/*.png
            ${{ runner.temp }}/**/session-export/**/artifacts/**/*.html
            ${{ runner.temp }}/**/session-management/*.png
            ${{ runner.temp }}/**/session-management/report.json
            ${{ runner.temp }}/**/session-list/*.png
            ${{ runner.temp }}/**/code-copy-*/*.png
          if-no-files-found: ignore
          retention-days: 7
