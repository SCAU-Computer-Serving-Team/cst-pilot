[package]
name = "cst-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cst-server"
path = "src/bin/cst-server.rs"

[dependencies]
pi-ai = { path = "../pi-ai" }
pi-agent = { path = "../pi-agent" }
pi-session = { path = "../pi-session" }
pi-runtime = { path = "../pi-runtime" }
cst-pilot = { path = "../cst-pilot" }
async-stream.workspace = true
base64.workspace = true
bytes.workspace = true
chromiumoxide.workspace = true
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
futures-core.workspace = true
futures-util.workspace = true
http = "=1.5.0"
http-body = "=1.1.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "http1", "server"] }
percent-encoding = "=2.3.2"
rand = "=0.10.3"
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
subtle = "=2.6.1"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
uuid.workspace = true
zeroize = "=1.9.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading"] }
