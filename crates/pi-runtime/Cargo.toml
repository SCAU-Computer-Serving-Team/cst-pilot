[package]
name = "pi-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pi"
path = "src/bin/pi.rs"
required-features = ["cli-modes"]

[[example]]
name = "release_notes_and_workflow_agent"
required-features = ["cli-modes"]

[features]
default = ["codemode", "mcp", "cli-modes", "coding-tools", "clipboard"]
codemode = ["dep:rquickjs"]
mcp = []
cli-modes = []
coding-tools = ["dep:similar", "dep:globset", "dep:regex-automata"]
clipboard = []
test-support = ["pi-ai/test-support", "pi-session/test-support"]

[dependencies]
pi-ai = { path = "../pi-ai" }
pi-agent = { path = "../pi-agent" }
pi-session = { path = "../pi-session" }
async-stream.workspace = true
base64.workspace = true
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
image.workspace = true
rquickjs = { workspace = true, optional = true }
unicode-segmentation.workspace = true
regex.workspace = true
regex-automata = { version = "0.4", optional = true }
ignore = "0.4"
globset = { version = "0.4", optional = true }
similar = { version = "2.7", optional = true }
icu_normalizer = { version = "2.4", default-features = false, features = ["compiled_data"] }
regress.workspace = true
reqwest.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
pi-ai = { path = "../pi-ai", features = ["test-support"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
