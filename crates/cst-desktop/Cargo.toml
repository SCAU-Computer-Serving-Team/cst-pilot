[package]
name = "cst-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "cst-pilot"
path = "src/main.rs"

[lib]
name = "cst_desktop"
path = "src/lib.rs"

[features]
default = []
test-support = ["gpui-kit/test-support"]
admin-manifest = []

[dependencies]
cst-os = { path = "../cst-os" }
cst-client = { path = "../cst-client" }
gpui-kit = "0.10.0"
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false, features = ["windows-manifest-provided-by-host"] }
anyhow = "1.0"
base64.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
unicode-segmentation.workspace = true
zeroize = "=1.9.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
naga = { version = "=30.0.2", default-features = false, features = ["glsl-in", "hlsl-out"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "=3.0.12"
windows = { version = "0.62", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
] }

[dev-dependencies]
gpui-kit = { version = "0.10.0", features = ["test-support"] }
uuid.workspace = true
